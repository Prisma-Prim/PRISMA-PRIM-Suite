        '404':
          description: >-
            The Document or Version is not visible inside the active Company and Document.
        '409':
          description: The revision or Version state is stale, the applicable five or ten reference capacity is reached, or the key was reused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentVersionConflict'
