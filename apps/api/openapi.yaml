        - $ref: '#/components/schemas/OfficialDocumentVersion'
        - $ref: '#/components/schemas/SupersededDocumentVersion'
      discriminator:
        propertyName: status
        mapping:
          draft: '#/components/schemas/DraftDocumentVersion'
          official: '#/components/schemas/OfficialDocumentVersion'
          superseded: '#/components/schemas/SupersededDocumentVersion'
