        target:
          type: object
          additionalProperties: false
          required: [type, versionId, companyId]
          properties:
            type: { type: string, const: project_template_version }
            versionId: { type: string, format: uuid }
            companyId: { type: string, format: uuid }
        metadata:
          type: object
          additionalProperties: false
          required: [templateKey, version, sourceVersion]
          properties:
            templateKey:
              { type: string, const: CONSULTING_PREPARATION_ILLUSTRATIVE }
            version: { type: integer, minimum: 2, maximum: 2147483647 }
            sourceVersion: { type: integer, minimum: 1, maximum: 2147483646 }
