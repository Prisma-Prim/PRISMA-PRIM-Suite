          properties:
            action:
              type: string
              const: activate
            expectedLifecycleRevision:
              $ref: '#/components/schemas/ProjectLifecycleRevision'
            declaration:
              $ref: '#/components/schemas/ProjectStartDeclaration'
            startException:
              type: object
              additionalProperties: false
              required:
                - reason
                - completionMembershipId
                - completionDueDate
              properties:
                reason:
                  $ref: '#/components/schemas/ProjectReason'
                completionMembershipId:
                  type: string
                  format: uuid
                completionDueDate:
                  type: string
                  format: date
                  description: An exact YYYY-MM-DD date, years 0001–9999; past dates are allowed.
        - type: object
          additionalProperties: false
          required:
            - action
            - expectedLifecycleRevision
            - reason
          properties:
            action:
              type: string
              const: hold
            expectedLifecycleRevision:
              $ref: '#/components/schemas/ProjectLifecycleRevision'
            reason:
              $ref: '#/components/schemas/ProjectReason'
        - type: object
          additionalProperties: false
          required:
            - action
            - expectedLifecycleRevision
            - note
          properties:
            action:
              type: string
              const: complete
            expectedLifecycleRevision:
