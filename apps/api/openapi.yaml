          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: companyId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The revoked canonical Company Task Result Recorder assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyTaskResultRecorderAssignment'
        '400':
          description: A target or idempotent command is invalid.
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks assignment authority or the assignment is outside the current Workspace.
  /api/company-document-content-reader-assignments:
    post:
      operationId: grantCompanyDocumentContentReaderAssignment
      summary: Grant the opt-in Company Document Content Reader v1 bundle to an active Workspace Membership
      description: >-
        Requires `company.assignment.manage`. The captured v1 bundle contains
        exactly `document.content.read`. It grants no Company context,
        Client read, Document metadata or reference read, Version management,
        or other content permission. No existing assignment is expanded.
        The actual grant records one minimal bundle-label Activity event.
      tags:
        - Access
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantCompanyContextAssignmentInput'
      responses:
        '201':
          description: The active canonical Company Document Content Reader assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDocumentContentReaderAssignment'
        '400':
          description: A target or idempotent command is invalid.
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks assignment authority or a target is not active in the current Workspace.
  /api/company-document-content-reader-assignments/{workspaceMembershipId}/{companyId}:
    delete:
      operationId: revokeCompanyDocumentContentReaderAssignment
      summary: Revoke the Company Document Content Reader assignment
      description: >-
