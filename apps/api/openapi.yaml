            'toStageKey',
          ],
        'properties':
          {
            'projectId': { 'type': 'string', 'format': 'uuid' },
            'transitionId': { 'type': 'string', 'format': 'uuid' },
            'stageRevision': { 'type': 'integer', 'const': 1 },
            'fromStageKey': { 'type': 'string', 'const': 'scoping' },
            'toStageKey': { 'type': 'string', 'const': 'preparation' },
