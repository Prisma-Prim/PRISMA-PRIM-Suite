              schema:
                $ref: '#/components/schemas/TemplateCreatedProject'
        '400':
          description: Malformed title, Client, key or unsupported Template Version.
        '401':
          description: No verified External Principal.
        '403':
          description: A current independent permission or Company prerequisite is missing.
        '404':
          description: No readable active original Client or exact supported source Version matches the selected Company.
        '409':
          description: The idempotency key belongs to another normalized creation intent.
  /api/projects/{projectId}/template:
    get:
      operationId: readCopiedProjectTemplate
      summary: Reopen the original immutable copied plan and Task identities
      description: >-
        Requires explicit Template read, Project read, Task read and the original
        Client/read relationship in the active Company. Historical readable original
        Clients and closed Projects retain their original copied provenance. Manual
        Projects return template:null. Source definitions are the preserved original
        snapshot, not current configuration or current editable Task titles.
      tags:
        - Project templates
      parameters:
        - $ref: '#/components/parameters/RequiredCompanyContextId'
        - in: path
          name: projectId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The copied plan or null for an ordinary manual Project.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - template
                properties:
                  template:
                    oneOf:
                      - $ref: '#/components/schemas/CopiedProjectTemplate'
                      - type: 'null'
        '400':
          description: Malformed Project identifier.
        '401':
          description: No verified External Principal.
        '403':
          description: A current independent permission or Company prerequisite is missing.
        '404':
          description: No readable Project in the selected Company.

  /api/projects/{projectId}/stage-progress:
    get:
      operationId: readProjectStageProgress
      summary: Read current copied stage, mapped Task outcomes and immutable transition history
      description: >-
        Requires live independent Template, Project, Task and original Client read in
        the active Company; no stage-advance grant is needed. No writes or events.
        Ordinary Projects return progress:null. The original copied snapshot and stable
        Task identities own the gate; cancelled Tasks never satisfy it.
      tags: [Project templates]
      parameters:
        - $ref: '#/components/parameters/RequiredCompanyContextId'
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Current preserved progress and Project-owned history, or null.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [progress]
                properties:
                  progress:
                    oneOf:
                      - $ref: '#/components/schemas/ProjectStageProgress'
                      - type: 'null'
        '400': { description: Malformed Project identifier. }
        '401': { description: No verified External Principal. }
        '403':
          { description: Independent copied-plan authority is unavailable. }
        '404': { description: No readable Project in the selected Company. }
  /api/projects/{projectId}/stage-advance:
    post:
      operationId: advanceIllustrativeProjectStage
      summary: Deliberately advance only Cadrage to Préparation after both mapped Tasks are done
      description: >-
        Requires independently assigned captured Company Project Stage Advancer v1 and
        copied-plan visibility, including Task read but not Task manage. New mutations
        require an open Project and active original Client. Serializes with existing
        Task commands, closure, Client fencing and successful revocation/suspension.
        The actor/Workspace key covers Company, Project, observed stage/revision and target.
        After live dedicated/read authority and visibility, identical committed replay
        returns its receipt before old-stage, closed or superseded mutation guards.
        Changed intent conflicts. A new transition atomically records progress, immutable
        Task/version proof, receipt, one minimal project.stage.changed event and Client fence.
        Reopening an earlier Task preserves reached stage and proof. No lifecycle mutation,
        backward/skip/final transition, automatic advance or real mission start exists.
      tags: [Project templates]
      parameters:
        - $ref: '#/components/parameters/RequiredCompanyContextId'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectStageAdvanceInput'
      responses:
        '201':
          description: One committed transition receipt, including an identical authorized replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectStageReceipt'
        '400':
          description: Invalid intent, Project identifier or idempotency key.
        '401': { description: No verified External Principal. }
        '403':
          {
            description: Live dedicated or independent read authority is unavailable.,
          }
        '404':
          {
            description: No readable copied Project or active original Client for a new mutation.,
          }
        '409':
          description: Incomplete required Tasks, stale revision, unsupported transition, closed Project or changed key intent.

components:
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: A caller-scoped command key whose replay returns the original command result.
      schema:
        type: string
        minLength: 1
    CompanyContextId:
      in: header
      name: X-Company-Context-Id
      required: false
      description: A Company selection hint revalidated by Access on this protected request.
      schema:
        type: string
    RequiredCompanyContextId:
      in: header
      name: X-Company-Context-Id
      required: true
      description: The active Company selection revalidated by Access for this Client operation.
      schema:
        type: string
    DocumentId:
      in: path
      name: documentId
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      in: path
      name: projectId
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      in: path
      name: taskId
      required: true
      schema:
        type: string
        format: uuid
  responses:
    TaskProjectConflict:
      description: The Project is closed, or the Task command conflicts.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ProjectClosedConflict'
              - $ref: '#/components/schemas/GenericConflict'
  schemas:
    ContractMissionPlanCreationInput:
      type: object
      additionalProperties: false
      required:
        [
          title,
          expectedContractRevision,
          acknowledgedCandidateProjectIds,
          missionPlan,
        ]
      properties:
        title:
          type: string
          pattern: \S
          description: Trimmed by the native Project owner to 1–200 characters.
        expectedContractRevision:
          type: integer
          minimum: 1
          maximum: 2147483646
        acknowledgedCandidateProjectIds:
          type: array
          maxItems: 50
          uniqueItems: true
          items: { type: string, format: uuid }
        missionPlan:
          type: object
          additionalProperties: false
          required: [planId, versionId, versionNumber]
          properties:
            planId: { type: string, format: uuid }
            versionId: { type: string, format: uuid }
            versionNumber: { type: integer, minimum: 1, maximum: 2147483647 }
    ContractMissionPlanCreationReceipt:
      type: object
      additionalProperties: false
      required: [project, link]
      properties:
        project:
          type: object
          additionalProperties: false
          required: [id, companyId, clientAccountId, title, status, createdAt]
          properties:
            id: { type: string, format: uuid }
            companyId: { type: string, format: uuid }
            clientAccountId: { type: string, format: uuid }
            title: { type: string, minLength: 1, maxLength: 200 }
            status: { const: preparatory }
            createdAt: { type: string, format: date-time }
        link:
          type: object
          additionalProperties: false
          required:
            [
              id,
              contractId,
              projectId,
              revision,
              created,
              actorWorkspaceMembershipId,
              linkedAt,
            ]
          properties:
            id: { type: string, format: uuid }
            contractId: { type: string, format: uuid }
            projectId: { type: string, format: uuid }
            revision: { type: integer, minimum: 4, maximum: 2147483647 }
            created: { const: true }
            actorWorkspaceMembershipId: { type: string, format: uuid }
            linkedAt: { type: string, format: date-time }
    OfferDetail:
      type: object
      additionalProperties: false
      required:
        - offer
      properties:
        offer:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/OfferRecord'
    OfferRecord:
      type: object
      additionalProperties: false
      required:
        - id
        - companyId
        - opportunityId
        - clientRequestId
        - originalClientAccountId
        - illustrativeReference
        - revision
        - provisional
        - createdByWorkspaceMembershipId
        - createdAt
        - version
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        opportunityId:
          type: string
          format: uuid
        clientRequestId:
          type: string
          format: uuid
        originalClientAccountId:
          type: string
          format: uuid
        illustrativeReference:
          type: integer
          minimum: 1
        revision:
          type: integer
          minimum: 1
          description: Server-owned optimistic-concurrency token, incremented by every committed Offer command except a Quality Check run.
        provisional:
          type: boolean
          const: true
        createdByWorkspaceMembershipId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        clientReference:
          $ref: '#/components/schemas/OfferClientReference'
        version:
          $ref: '#/components/schemas/OfferVersion'
    OfferClientReference:
      type: object
      additionalProperties: false
      required:
        - originalClientId
        - displayName
      properties:
        originalClientId:
          type: string
          format: uuid
        currentClientId:
          type: string
          format: uuid
        displayName:
          type: string
    OfferVersion:
      type: object
      additionalProperties: false
      required:
        - id
        - versionNumber
        - predecessorVersionId
        - supersededByVersionId
        - supersededAt
        - differences
        - pricingSnapshotId
        - pricingSnapshot
        - recipient
        - issuingCompanyLabel
        - validityDays
        - validUntil
        - scopeNote
        - commercialConditions
        - decisionState
        - decision
        - transmissionState
        - transmission
        - clientResponseState
        - clientResponse
        - latestQualityRun
        - validityElapsed
        - provenance
        - provisional
        - createdByWorkspaceMembershipId
        - createdAt
        - representation
        - qualityRuleSet
        - qualityRuleSetVersion
      properties:
        id:
          type: string
          format: uuid
        versionNumber:
          type: integer
          minimum: 1
          description: Server-allocated, monotone per Offer, starting at 1.
        predecessorVersionId:
          description: Null for version 1; otherwise the version this one succeeds.
          oneOf:
            - type: 'null'
            - type: string
              format: uuid
        supersededByVersionId:
          description: Lineage metadata written once when a successor is created; never content.
          oneOf:
            - type: 'null'
            - type: string
              format: uuid
        supersededAt:
          oneOf:
            - type: 'null'
            - type: string
              format: date-time
        differences:
          type: array
          description: Field-level differences from the predecessor; empty for version 1.
          items:
            $ref: '#/components/schemas/OfferVersionDifference'
        pricingSnapshotId:
          type: string
          format: uuid
        pricingSnapshot:
          $ref: '#/components/schemas/OfferPricingSnapshot'
        recipient:
          $ref: '#/components/schemas/OfferRecipientCopy'
        issuingCompanyLabel:
          type: string
          minLength: 1
        validityDays:
          type: integer
          minimum: 1
          maximum: 365
        validUntil:
          type: string
          format: date-time
        scopeNote:
          oneOf:
            - type: 'null'
            - type: string
              maxLength: 2000
        commercialConditions:
          oneOf:
            - type: 'null'
            - type: string
              maxLength: 4000
        decisionState:
          type: string
          enum:
            - PENDING
            - APPROVED
            - REJECTED
        decision:
          description: Null while the decision is `PENDING`.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/OfferApprovedDecision'
            - $ref: '#/components/schemas/OfferRejectedDecision'
        transmissionState:
          type: string
          enum:
            - NOT_TRANSMITTED
            - TRANSMITTED
        transmission:
          description: Null while the version is `NOT_TRANSMITTED`.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/OfferTransmission'
        clientResponseState:
          type: string
          description: '`NONE` while not transmitted; `PENDING` once transmitted until a response is recorded.'
          enum:
            - NONE
            - PENDING
            - ACCEPTED
            - REJECTED
            - EXPIRED
        clientResponse:
          description: Null until a Client response is recorded.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/OfferClientResponse'
        latestQualityRun:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/OfferQualityRun'
        validityElapsed:
          type: boolean
          description: Derived at read time; true when the server instant is at or after `validUntil`.
        provenance:
          type: string
          const: ILLUSTRATIVE
        provisional:
          type: boolean
          const: true
        createdByWorkspaceMembershipId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        representation:
          $ref: '#/components/schemas/OfferRepresentation'
        qualityRuleSet:
          type: string
          const: OFFER_QUALITY_ILLUSTRATIVE
        qualityRuleSetVersion:
          type: integer
          enum: [1, 2]
          description: Fixed at version creation together with the Template version.
    OfferVersionDifference:
      type: object
      additionalProperties: false
      required:
        - field
        - previous
        - current
        - changed
      properties:
        field:
          type: string
        previous:
          oneOf:
            - type: 'null'
            - type: string
            - type: integer
        current:
          oneOf:
            - type: 'null'
            - type: string
            - type: integer
        changed:
          type: boolean
    OfferQualityCode:
      type: string
      enum:
        - PRICING_SNAPSHOT_COHERENT
        - CURRENCY_UNCHANGED
        - VALIDITY_OPEN
        - RECIPIENT_AVAILABLE
        - RECIPIENT_IDENTITY_CURRENT
        - RECIPIENT_TAX_ID_RECORDED
        - PRICING_CLIENT_CONTEXT_COHERENT
        - PROVISIONAL_MARKER_PRESENT
    OfferAcknowledgedWarningCodes:
      type: array
      uniqueItems: true
      items:
        $ref: '#/components/schemas/OfferQualityCode'
    OfferQualityRun:
      type: object
      additionalProperties: false
      required:
        - id
        - offerVersionId
        - ruleSet
        - ruleSetVersion
        - actorWorkspaceMembershipId
        - evaluatedAt
        - results
      properties:
        id:
          type: string
          format: uuid
        offerVersionId:
          type: string
          format: uuid
        ruleSet:
          type: string
          const: OFFER_QUALITY_ILLUSTRATIVE
        ruleSetVersion:
          type: integer
          enum: [1, 2]
          description: Equals the version's bound `qualityRuleSetVersion`.
        actorWorkspaceMembershipId:
          type: string
          format: uuid
        evaluatedAt:
          type: string
          format: date-time
        results:
          type: array
          minItems: 8
          maxItems: 8
          description: One result per rule, in rule set order.
          items:
            type: object
            additionalProperties: false
            required:
              - code
              - status
            properties:
              code:
                $ref: '#/components/schemas/OfferQualityCode'
              status:
                type: string
                enum:
                  - PASS
                  - WARNING
                  - ERROR
    OfferApprovedDecision:
      type: object
      additionalProperties: false
      required:
        - id
        - offerVersionId
        - offerRevision
        - actorWorkspaceMembershipId
        - decidedAt
        - state
        - qualityRun
        - acknowledgedWarningCodes
        - representationSha256
      properties:
        id:
          type: string
          format: uuid
        offerVersionId:
          type: string
          format: uuid
        offerRevision:
          type: integer
          minimum: 1
        actorWorkspaceMembershipId:
          type: string
          format: uuid
        decidedAt:
          type: string
          format: date-time
        state:
          type: string
          const: APPROVED
        qualityRun:
          $ref: '#/components/schemas/OfferQualityRun'
        acknowledgedWarningCodes:
          $ref: '#/components/schemas/OfferAcknowledgedWarningCodes'
        representationSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
    OfferRejectedDecision:
      type: object
      additionalProperties: false
      required:
        - id
        - offerVersionId
        - offerRevision
        - actorWorkspaceMembershipId
        - decidedAt
        - state
        - reason
      properties:
        id:
          type: string
          format: uuid
        offerVersionId:
          type: string
          format: uuid
        offerRevision:
          type: integer
          minimum: 1
        actorWorkspaceMembershipId:
          type: string
          format: uuid
        decidedAt:
          type: string
          format: date-time
        state:
          type: string
          const: REJECTED
        reason:
          type: string
          minLength: 1
          maxLength: 500
    OfferTransmission:
      type: object
      additionalProperties: false
      required:
        - id
        - offerVersionId
        - offerRevision
        - actorWorkspaceMembershipId
        - transmittedAt
        - channel
        - note
        - qualityRun
        - acknowledgedWarningCodes
        - representationSha256
      properties:
        id:
          type: string
          format: uuid
        offerVersionId:
          type: string
          format: uuid
        offerRevision:
          type: integer
          minimum: 1
        actorWorkspaceMembershipId:
          type: string
          format: uuid
        transmittedAt:
          type: string
          format: date-time
        channel:
          type: string
          const: SIMULATED
        note:
          oneOf:
            - type: 'null'
            - type: string
              maxLength: 500
        qualityRun:
          $ref: '#/components/schemas/OfferQualityRun'
        acknowledgedWarningCodes:
          $ref: '#/components/schemas/OfferAcknowledgedWarningCodes'
        representationSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
    OfferClientResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - offerVersionId
        - offerRevision
        - actorWorkspaceMembershipId
        - decidedAt
        - evidenceKind
        - outcome
      properties:
        id:
          type: string
          format: uuid
        offerVersionId:
          type: string
          format: uuid
        offerRevision:
          type: integer
          minimum: 1
        actorWorkspaceMembershipId:
          type: string
          format: uuid
        decidedAt:
          type: string
          format: date-time
        evidenceKind:
          type: string
          const: SIMULATED
        outcome:
          type: string
          enum:
            - ACCEPTED
            - REJECTED
            - EXPIRED
        receivedAt:
          type: string
          format: date-time
        reason:
          type: string
          minLength: 1
          maxLength: 500
      oneOf:
        - properties:
            outcome:
              const: ACCEPTED
          required:
            - receivedAt
          not:
            required:
              - reason
        - properties:
            outcome:
              const: REJECTED
          required:
            - receivedAt
            - reason
        - properties:
            outcome:
              const: EXPIRED
          allOf:
            - not:
                required:
                  - receivedAt
            - not:
                required:
                  - reason
    OfferRecipientCopy:
      oneOf:
        - $ref: '#/components/schemas/OfferPrimaryRecipientCopy'
        - $ref: '#/components/schemas/OfferAdditionalRecipientCopy'
    OfferPrimaryRecipientCopy:
      type: object
      additionalProperties: false
      required:
        - kind
        - legalName
        - taxId
        - legalAddress
      properties:
        kind:
          type: string
          const: PRIMARY
        legalName:
          type: string
          minLength: 1
          maxLength: 200
        taxId:
          oneOf:
            - type: 'null'
            - type: string
              minLength: 1
              maxLength: 500
        legalAddress:
          oneOf:
            - type: 'null'
            - type: string
              minLength: 1
              maxLength: 2000
    OfferAdditionalRecipientCopy:
      type: object
      additionalProperties: false
      required:
        - kind
        - additionalLegalEntityId
        - legalName
        - taxId
        - legalAddress
      properties:
        kind:
          type: string
          const: ADDITIONAL
        additionalLegalEntityId:
          type: string
          format: uuid
        legalName:
          type: string
          minLength: 1
          maxLength: 200
        taxId:
          oneOf:
            - type: 'null'
            - type: string
              minLength: 1
              maxLength: 500
        legalAddress:
          oneOf:
            - type: 'null'
            - type: string
              minLength: 1
              maxLength: 2000
    OfferRepresentation:
      type: object
      additionalProperties: false
      required:
        - templateCode
        - templateVersion
        - html
        - sha256
      properties:
        templateCode:
          type: string
          const: OFFER_ILLUSTRATIVE
        templateVersion:
          type: integer
          enum: [1, 2]
          description: 2 exactly when the version's Pricing Snapshot has an adjusted line.
        html:
          type: string
          minLength: 1
          description: Deterministic English HTML bytes decoded as UTF-8; no stored file is created.
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Lowercase SHA-256 of the UTF-8 bytes represented by `html`.
    OfferPricingSnapshot:
      type: object
      additionalProperties: false
      required:
        - id
        - opportunityId
        - clientRequestId
        - pricingRuleVersion
        - currency
        - lines
        - subtotal
        - taxTotal
        - total
        - calculatedByWorkspaceMembershipId
        - calculatedAt
        - committedAt
        - version
        - provenance
        - provisional
      properties:
        id:
          type: string
          format: uuid
        opportunityId:
          type: string
          format: uuid
        clientRequestId:
          type: string
          format: uuid
        clientReference:
          $ref: '#/components/schemas/OfferClientReference'
        pricingRuleVersion:
          $ref: '#/components/schemas/OfferPricingRuleVersion'
        currency:
          type: string
          enum:
            - MDL
            - EUR
            - RON
            - USD
        lines:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/OfferPricingSnapshotLine'
        subtotal:
          type: string
        taxTotal:
          type: string
        total:
          type: string
        calculatedByWorkspaceMembershipId:
          type: string
          format: uuid
        calculatedAt:
          type: string
          format: date-time
        committedAt:
          type: string
          format: date-time
        version:
          type: integer
          const: 1
        provenance:
          type: string
          const: ILLUSTRATIVE
        provisional:
          type: boolean
          const: true
    OfferPricingRuleVersion:
      type: object
      additionalProperties: false
      required:
        - id
        - versionNumber
        - ruleShape
        - roundingMode
        - roundingScale
        - taxApplication
      properties:
        id:
          type: string
          format: uuid
        versionNumber:
          type: integer
          minimum: 1
        ruleShape:
          type: string
          const: UNIT_PRICE_TIMES_QUANTITY
        roundingMode:
          type: string
          const: HALF_UP
        roundingScale:
          type: integer
          const: 2
        taxApplication:
          type: string
          const: PER_LINE
    OfferPricingSnapshotLine:
      type: object
      additionalProperties: false
      required:
        - position
        - serviceDefinitionId
        - serviceCode
        - serviceName
        - offeringId
        - commercialLabel
        - tariffVersionId
        - tariffVersionNumber
        - unit
        - unitAmount
        - currency
        - taxRatePercent
        - taxLabel
        - quantity
        - ruleShape
        - rawLineAmount
        - lineNet
        - rawLineTax
        - lineTax
        - adjustment
        - netReduction
        - taxReduction
        - adjustedLineNet
        - adjustedRawLineTax
        - adjustedLineTax
      properties:
        position:
          type: integer
          minimum: 1
          maximum: 20
        serviceDefinitionId:
          type: string
          format: uuid
        serviceCode:
          type: string
        serviceName:
          type: string
        offeringId:
          type: string
          format: uuid
        commercialLabel:
          oneOf:
            - type: 'null'
            - type: string
        tariffVersionId:
          type: string
          format: uuid
        tariffVersionNumber:
          type: integer
          minimum: 1
        unit:
          type: string
        unitAmount:
          type: string
        currency:
          type: string
          enum:
            - MDL
            - EUR
            - RON
            - USD
        taxRatePercent:
          type: string
        taxLabel:
          type: string
        quantity:
          type: string
        ruleShape:
          type: string
          const: UNIT_PRICE_TIMES_QUANTITY
        rawLineAmount:
          type: string
        lineNet:
          type: string
        rawLineTax:
          type: string
        lineTax:
          type: string
        adjustment:
          description: Null for an unadjusted line; otherwise the stored fixed net discount, returned exactly as recorded.
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required:
                - type
                - netReduction
                - taxReduction
                - reason
                - appliedByWorkspaceMembershipId
                - appliedAt
              properties:
                type:
                  type: string
                  const: FIXED_NET_DISCOUNT
                netReduction:
                  type: string
                taxReduction:
                  type: string
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                appliedByWorkspaceMembershipId:
                  type: string
                  format: uuid
                appliedAt:
                  type: string
                  format: date-time
        netReduction:
          type: string
        taxReduction:
          type: string
        adjustedLineNet:
          type: string
        adjustedRawLineTax:
          type: string
        adjustedLineTax:
          type: string
    OperationalHome:
      type: object
      additionalProperties: false
      required:
        - companyId
        - today
        - summaries
      properties:
        companyId:
          type: string
          format: uuid
          description: The active Company every count belongs to.
        today:
          type: string
          format: date
          description: The `Europe/Chisinau` calendar date of the one sampled server instant.
        summaries:
          type: array
          maxItems: 3
          description: >-
            At most one entry per kind, in the order `active_clients`,
            `open_projects`, `overdue_tasks`. A kind the reader may not read is
            absent, never present with 0.
          items:
            $ref: '#/components/schemas/CompanySummary'
    CompanySummary:
      type: object
      additionalProperties: false
      required:
        - kind
        - count
      properties:
        kind:
          type: string
          enum:
            - active_clients
            - open_projects
            - overdue_tasks
          description: >-
            `active_clients` counts the `GET /api/clients` rows and requires
            the Client directory read (Company `client.read`, or Workspace
            `client.manage`). `open_projects` counts the open-status rows of
            `GET /api/projects` and requires the Project list read.
            `overdue_tasks` equals the `GET /api/overdue-tasks` total and
            requires the Task read.
        count:
          type: integer
          minimum: 0
    CompanyOverdueTasks:
      type: object
      additionalProperties: false
      required:
        - companyId
        - today
        - total
        - tasks
      properties:
        companyId:
          type: string
          format: uuid
        today:
          type: string
          format: date
        total:
          type: integer
          minimum: 0
        tasks:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/OverdueTask'
    OverdueTask:
      type: object
      description: >-
        The Task row `GET /api/assigned-tasks` returns, including its
        responsible member or null, plus the whole calendar days from its due
        date to `today`.
      required:
        - id
        - companyId
        - projectId
        - clientAccountId
        - title
        - assignee
        - dueDate
        - priority
        - status
        - completion
        - version
        - createdAt
        - updatedAt
        - createdBy
        - project
        - daysOverdue
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        clientAccountId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        assignee:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required:
                - workspaceMembershipId
                - displayLabel
              properties:
                workspaceMembershipId:
                  type: string
                  format: uuid
                displayLabel:
                  type: string
        dueDate:
          type: string
          format: date
        priority:
          type: string
          enum:
            - normal
            - important
            - critical
          description: The manual Task priority (#375); it does not change the overdue order.
        status:
          type: string
          enum:
            - todo
            - in_progress
            - blocked
        completion:
          type: 'null'
        blockage:
          type: object
          description: Present only for a `blocked` Task.
          required:
            - reason
            - actor
            - occurredAt
          properties:
            reason:
              type: string
            actor:
              $ref: '#/components/schemas/TaskActor'
            occurredAt:
              type: string
              format: date-time
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          $ref: '#/components/schemas/TaskActor'
        project:
          type: object
          additionalProperties: false
          required:
            - id
            - title
            - clientDisplayName
          properties:
            id:
              type: string
              format: uuid
            title:
              type: string
            clientDisplayName:
              type: string
              description: The Client label the Project list shows, including a superseded original label.
        daysOverdue:
          type: integer
          minimum: 1
