openapi: 3.1.0
info:
  title: PRISMA-PRIM Suite API
  version: 0.1.0
paths:
  /api/access/current-actor:
    get:
      operationId: getCurrentActor
      summary: Resolve the verified external identity to the current Internal User
      tags:
        - Access
      responses:
        '200':
          description: The active local actor and persistent Workspace context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorContext'
        '401':
          description: No verified External Principal is available.
        '403':
          description: The resolved Internal User is inactive.
  /api/activity-log:
    get:
      operationId: listCurrentWorkspaceActivity
      summary: List visible Activity Log events for the current Workspace
      tags:
        - Accountability
      responses:
        '200':
          description: A bounded reverse-chronological Activity Log page.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - events
                properties:
                  events:
                    type: array
                    maxItems: 50
                    items:
                      $ref: '#/components/schemas/ActivityLogEvent'
        '401':
          description: No verified External Principal is available.
        '403':
          description: The resolved Internal User is inactive.
components:
  schemas:
    ActivityLogEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - action
        - occurredAt
        - actor
        - target
        - metadata
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
          enum:
            - internal_user.provisioned
        occurredAt:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/ActivityLogInternalUserReference'
        target:
          $ref: '#/components/schemas/ActivityLogInternalUserTargetReference'
        metadata:
          type: object
          additionalProperties: false
          required:
            - identityProvider
          properties:
            identityProvider:
              type: string
    ActivityLogInternalUserReference:
      type: object
      additionalProperties: false
      required:
        - internalUserId
        - displayName
      properties:
        internalUserId:
          type: string
          format: uuid
        displayName:
          type: string
    ActivityLogInternalUserTargetReference:
      type: object
      additionalProperties: false
      required:
        - type
        - internalUserId
        - displayName
      properties:
        type:
          type: string
          const: internal_user
        internalUserId:
          type: string
          format: uuid
        displayName:
          type: string
    ActorContext:
      type: object
      additionalProperties: false
      required:
        - internalUserId
        - workspaceId
        - workspaceName
        - displayName
        - email
        - active
      properties:
        internalUserId:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        workspaceName:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
        active:
          type: boolean
          const: true
