          format: uuid
    ClientDuplicateReviewDetail:
      oneOf:
        - $ref: '#/components/schemas/ClientDuplicateReviewComparison'
        - $ref: '#/components/schemas/ClientDuplicateReviewRemediation'
    ActorContext:
      type: object
      additionalProperties: false
      required:
        - internalUserId
        - workspaceMembershipId
        - workspaceId
        - workspaceName
        - displayName
        - email
        - active
        - workspacePermissions
      properties:
        internalUserId:
          type: string
          format: uuid
        workspaceMembershipId:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        workspaceName:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
        active:
          type: boolean
          const: true
        workspacePermissions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - company.manage
