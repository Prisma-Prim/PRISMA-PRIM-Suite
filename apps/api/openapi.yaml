                required:
                  - members
                properties:
                  members:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectLifecycleMember'
        '400':
          description: The Project id is malformed.
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks the live Approver, Project read or Client read.
        '404':
          description: The Project is not visible, or its original Client is superseded.
  /api/projects/{projectId}/lifecycle-transitions:
    post:
      operationId: transitionProjectLifecycle
      summary: Transition or close a Project at its observed lifecycle revision
      description: >-
        Activation, hold and resume require a live Company Project Approver v1
        `project.lifecycle.transition`; completion and cancellation require the
        same live assignment with `project.close`. Every action also requires
        Project detail read and Client read. One transaction takes the
        per-actor key lock, checks live authority and visibility, resolves an
        exact replay, locks the original Client identity then relationship and
        the Project row, and checks the revision and state. A commit writes the
        status and revision, the transition record (plus the immutable start
        declaration on activation), one durable receipt, exactly one
        `project.lifecycle.changed` event and the original Client
        operational-use fence advance. An exact replay first revalidates live
        authority and visibility and then returns the recorded body without any
        new write. No transition changes a Task, Document association, Request
        or responsible member. Completion and cancellation are refused while
        any Task is still open.
      tags:
        - Project
      parameters:
        - $ref: '#/components/parameters/RequiredCompanyContextId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectLifecycleTransitionCommand'
      responses:
        '200':
          description: The committed transition, or the recorded result of an exact replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectLifecycleReceipt'
        '400':
          description: >-
            The key is missing; the action is unknown; a body key is missing or
            unknown; an identifier, reason, note, date or declaration value is
            malformed; a start exception is present with no missing item or
            absent with one; or the completion member is unavailable.
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks the live Approver, Project read or Client read.
        '404':
          description: The Project is not visible, or its original Client is superseded.
        '409':
          description: >-
            `project_lifecycle_conflict` for a stale or exhausted revision,
            `project_lifecycle_transition_invalid` for a source status the
            action does not leave, `project_responsible_required` for an
            activation without a responsible member, `project_open_tasks` when
            completion or cancellation still has an open Task, or a plain
            conflict when the Idempotency-Key was already used for another
            Project, action or body. Nothing is written.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ProjectLifecycleConflict'
                  - $ref: '#/components/schemas/GenericConflict'
  /api/operational-home:
    get:
      operationId: readOperationalHome
      summary: Count the active Company records the reader can open
      description: >-
        Operational Dashboard PRD section 17. The read samples the server clock
        once; `today` is that instant's calendar date in `Europe/Chisinau` and
        every date comparison uses it. The counts come from one repeatable-read
        snapshot. A summary appears only when the reader holds, in the active
        Company, the read that owns its records, evaluated live exactly as that
        read evaluates it; otherwise it is absent, never zero. Each count equals
        the number of records its drill-down lists for the same reader and
        state. The read records no Activity Log event, command receipt, version
        or Client fence advance.
      tags:
        - Operational home
      parameters:
        - $ref: '#/components/parameters/RequiredCompanyContextId'
      responses:
        '200':
          description: The Company summaries the reader may read, in the fixed kind order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHome'
        '400':
          description: A query parameter is present; the read takes none.
        '401':
          description: No verified External Principal is available.
        '403':
          description: >-
            No valid active Company context, or the reader holds none of the
            Client directory, Project list and Task reads in the active
            Company. The body is the delivered safe denial.
  /api/overdue-tasks:
    get:
      operationId: listCompanyOverdueTasks
      summary: List the active Company overdue Tasks in the reader's Project list
      description: >-
        Open Tasks (`todo`, `in_progress`, `blocked`) of the reader's Project
        list in the active Company, whatever their responsible member and
        including unassigned Tasks, whose exact due date is before `today`,
        the calendar date in `Europe/Chisinau` of the one sampled server
        instant. Undated Tasks and Tasks due `today` are not overdue. Rows are
        ordered by due date, then creation time, then identifier; at most the
        first 100 are returned with the total. Every refusal equals that of
        `GET /api/assigned-tasks`. The read writes nothing.
      tags:
        - Task
      parameters:
        - $ref: '#/components/parameters/RequiredCompanyContextId'
      responses:
        '200':
          description: The overdue total and at most its 100 oldest Tasks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyOverdueTasks'
        '400':
          description: A query parameter is present; the read takes none.
        '401':
          description: No verified External Principal is available.
        '403':
          description: >-
            No valid active Company context, or the reader lacks captured
            Company Task Manager v1 `task.read`, Project read or Client read in
            the active Company, exactly as `GET /api/assigned-tasks` refuses.
components:
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: A caller-scoped command key whose replay returns the original command result.
      schema:
        type: string
        minLength: 1
    CompanyContextId:
      in: header
      name: X-Company-Context-Id
      required: false
      description: A Company selection hint revalidated by Access on this protected request.
      schema:
        type: string
    RequiredCompanyContextId:
      in: header
      name: X-Company-Context-Id
      required: true
      description: The active Company selection revalidated by Access for this Client operation.
      schema:
        type: string
    DocumentId:
      in: path
      name: documentId
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      in: path
      name: projectId
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      in: path
      name: taskId
      required: true
      schema:
        type: string
        format: uuid
  responses:
    TaskProjectConflict:
      description: The Project is closed, or the Task command conflicts.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ProjectClosedConflict'
              - $ref: '#/components/schemas/GenericConflict'
  schemas:
    OperationalHome:
      type: object
      additionalProperties: false
      required:
        - companyId
        - today
        - summaries
      properties:
        companyId:
          type: string
          format: uuid
          description: The active Company every count belongs to.
        today:
          type: string
          format: date
          description: The `Europe/Chisinau` calendar date of the one sampled server instant.
        summaries:
          type: array
          maxItems: 3
          description: >-
            At most one entry per kind, in the order `active_clients`,
            `open_projects`, `overdue_tasks`. A kind the reader may not read is
            absent, never present with 0.
          items:
            $ref: '#/components/schemas/CompanySummary'
    CompanySummary:
      type: object
      additionalProperties: false
      required:
        - kind
        - count
      properties:
        kind:
          type: string
          enum:
            - active_clients
            - open_projects
            - overdue_tasks
          description: >-
            `active_clients` counts the `GET /api/clients` rows and requires
            the Client directory read (Company `client.read`, or Workspace
            `client.manage`). `open_projects` counts the open-status rows of
            `GET /api/projects` and requires the Project list read.
            `overdue_tasks` equals the `GET /api/overdue-tasks` total and
            requires the Task read.
        count:
          type: integer
          minimum: 0
    CompanyOverdueTasks:
      type: object
      additionalProperties: false
      required:
        - companyId
        - today
        - total
        - tasks
      properties:
