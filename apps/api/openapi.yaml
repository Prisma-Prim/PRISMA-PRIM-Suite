      additionalProperties: false
      required:
        - title
        - purpose
      properties:
        title:
          type: string
        purpose:
          type: string
    DocumentVersionReferences:
      description: >-
        Ordered current unverified external references. A draft has at most
        five and an official Version at most ten. The first item is primary.
        The external content is never stored, fetched or verified and may
        change at its source.
      type: array
      minItems: 1
      maxItems: 10
      items:
        oneOf:
          - type: object
            additionalProperties: false
            required:
              [
                id,
                kind,
                verification,
                position,
                form,
                primary,
                appendedAfterDesignation,
                addedAt,
                addedBy,
                access,
                url,
              ]
            properties:
              id:
                type: string
                format: uuid
              position: { type: integer, minimum: 1 }
              form: { type: string, enum: [editable, rendered, signed, other] }
              primary: { type: boolean }
              appendedAfterDesignation: { type: boolean }
              addedAt: { type: string, format: date-time }
              addedBy: { $ref: '#/components/schemas/DocumentActorLabel' }
              kind:
                type: string
                const: external-reference
              verification:
                type: string
                const: unverified
              access:
                type: string
                const: granted
              url:
                type: string
                format: uri
          - type: object
            additionalProperties: false
            required:
              [
                id,
                kind,
                verification,
                position,
                form,
                primary,
                appendedAfterDesignation,
                addedAt,
                addedBy,
                access,
              ]
            properties:
              id:
                type: string
                format: uuid
              position: { type: integer, minimum: 1 }
              form: { type: string, enum: [editable, rendered, signed, other] }
              primary: { type: boolean }
              appendedAfterDesignation: { type: boolean }
              addedAt: { type: string, format: date-time }
              addedBy: { $ref: '#/components/schemas/DocumentActorLabel' }
              kind:
                type: string
                const: external-reference
              verification:
                type: string
                const: unverified
              access:
                type: string
                const: denied
