          type: string
          format: uuid
        today:
          type: string
          format: date
        total:
          type: integer
          minimum: 0
        tasks:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/OverdueTask'
    OverdueTask:
      type: object
      description: >-
        The Task row `GET /api/assigned-tasks` returns, including its
        responsible member or null, plus the whole calendar days from its due
        date to `today`.
      required:
        - id
        - companyId
        - projectId
        - clientAccountId
        - title
        - assignee
        - dueDate
        - priority
        - status
        - completion
        - version
        - createdAt
        - updatedAt
        - createdBy
