        '200':
          description: The current lifecycle and at most the 50 most recent transitions, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectLifecycle'
        '400':
          description: The Project id is malformed.
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks current Project read or Client read in a valid active Company, exactly as for Project detail.
        '404':
          description: No Project with a readable original Client is visible in the active Company, exactly as for Project detail.
  /api/projects/{projectId}/eligible-start-exception-members:
    get:
      operationId: listEligibleStartExceptionMembers
      summary: List the members who may be named to complete a start exception
      description: >-
        The Project/Task PRD section 21 eligibility, offered only to a live
        Company Project Approver `project.lifecycle.transition` holder with
        Project read and Client read. It reveals no email, count of excluded
        members or exclusion reason. A superseded original Client returns the
        detail's safe not-found. A completed or cancelled Project also returns
        the same safe not-found because it has no mutable eligibility.
