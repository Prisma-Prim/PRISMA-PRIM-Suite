              { 'type': 'integer', 'minimum': 1, 'maximum': 2147483647 },
          },
      }

    ProjectStageTransition:
      {
        'type': 'object',
        'additionalProperties': false,
        'required':
          [
            'projectId',
            'transitionId',
            'stageRevision',
            'fromStageKey',
            'toStageKey',
            'fromStageTitle',
            'toStageTitle',
            'occurredAt',
            'actor',
            'requiredTasks',
          ],
        'properties':
          {
            'projectId': { 'type': 'string', 'format': 'uuid' },
            'transitionId': { 'type': 'string', 'format': 'uuid' },
            'stageRevision': { 'type': 'integer', 'const': 1 },
            'fromStageKey': { 'type': 'string', 'const': 'scoping' },
            'toStageKey': { 'type': 'string', 'const': 'preparation' },
            'fromStageTitle':
              { 'type': 'string', 'minLength': 1, 'maxLength': 200 },
            'toStageTitle':
              { 'type': 'string', 'minLength': 1, 'maxLength': 200 },
            'occurredAt': { 'type': 'string', 'format': 'date-time' },
            'actor':
              {
                'type': 'object',
                'additionalProperties': false,
                'required':
                  ['internalUserId', 'workspaceMembershipId', 'displayName'],
                'properties':
                  {
                    'internalUserId': { 'type': 'string', 'format': 'uuid' },
                    'workspaceMembershipId':
                      { 'type': 'string', 'format': 'uuid' },
                    'displayName':
                      { 'type': 'string', 'minLength': 1, 'maxLength': 200 },
                  },
              },
            'requiredTasks':
              {
                'type': 'array',
                'minItems': 2,
                'maxItems': 2,
                'items':
                  { '$ref': '#/components/schemas/ProjectStageTaskProof' },
