      type: object
      additionalProperties: false
      required: [id, revision, declaration, actor, occurredAt, reference, kind]
      properties:
        id: { type: string, format: uuid }
        revision: { type: integer, minimum: 1, maximum: 2147483647 }
        declaration: { type: string, minLength: 1, maxLength: 2000 }
