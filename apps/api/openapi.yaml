                $ref: '#/components/schemas/TaskResultReceipt'
        '400':
          description: Malformed declaration, reason, observations or key.
        '401': { description: No verified identity. }
        '403': { description: Missing current command authority. }
        '404': { description: Unavailable Task or eligible exact Version. }
        '409':
