          $ref: '#/components/schemas/ProjectStatus'
        to:
          $ref: '#/components/schemas/ProjectStatus'
        occurredAt:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/ProjectLifecycleActor'
