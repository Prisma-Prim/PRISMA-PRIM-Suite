openapi: 3.1.0
info:
  title: PRISMA-PRIM Suite API
  version: 0.1.0
paths:
  /api/access/current-actor:
    get:
      operationId: getCurrentActor
      summary: Resolve the verified external identity to the current Internal User
      tags:
        - Access
      parameters:
        - $ref: '#/components/parameters/CompanyContextId'
      responses:
        '200':
          description: The active local actor and persistent Workspace context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorContext'
        '401':
          description: No verified External Principal is available.
        '403':
          description: The principal has no active authority or the requested Company context is invalid.
  /api/activity-log:
    get:
      operationId: listCurrentWorkspaceActivity
      summary: List visible Activity Log events for the current Workspace
      tags:
        - Accountability
      parameters:
        - $ref: '#/components/parameters/CompanyContextId'
      responses:
        '200':
          description: A bounded reverse-chronological Activity Log page.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - events
                properties:
                  events:
                    type: array
                    maxItems: 50
                    items:
                      $ref: '#/components/schemas/ActivityLogEvent'
        '401':
          description: No verified External Principal is available.
        '403':
          description: The principal has no active authority or the requested Company context is invalid.
  /api/companies:
    get:
      operationId: listVisibleCompanies
      summary: List active Companies visible to the actor in the current Workspace
      tags:
        - Company
      parameters:
        - $ref: '#/components/parameters/CompanyContextId'
      responses:
        '200':
          description: Active visible Companies ordered by display name and identifier.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompanyRecord'
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks Company visibility or the requested Company context is invalid.
    post:
      operationId: registerCompany
      summary: Register one provider Company in the actor's Workspace
      tags:
        - Company
      parameters:
        - $ref: '#/components/parameters/CompanyContextId'
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCompanyInput'
      responses:
        '201':
          description: The registered active provider Company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyRecord'
        '400':
          description: The Company display name or idempotency key is blank or missing.
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks Company administration or the requested Company context is invalid.
  /api/companies/{companyId}:
    get:
      operationId: getCompany
      summary: Read one provider Company in the actor's Workspace
      tags:
        - Company
      parameters:
        - $ref: '#/components/parameters/CompanyContextId'
        - in: path
          name: companyId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The Workspace-owned provider Company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyRecord'
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks Company visibility or the requested Company context is invalid.
        '404':
          description: No visible Company matches the identifier in the actor's Workspace.
components:
  parameters:
    CompanyContextId:
      in: header
      name: X-Company-Context-Id
      required: false
      description: A Company selection hint revalidated by Access on this protected request.
      schema:
        type: string
  schemas:
    ActivityLogEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - action
        - occurredAt
        - actor
        - target
        - metadata
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
          enum:
            - internal_user.provisioned
            - company.registered
        occurredAt:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/ActivityLogInternalUserReference'
        target:
          oneOf:
            - $ref: '#/components/schemas/ActivityLogInternalUserTargetReference'
            - $ref: '#/components/schemas/ActivityLogCompanyTargetReference'
        metadata:
          oneOf:
            - $ref: '#/components/schemas/IdentityProvisionedMetadata'
            - $ref: '#/components/schemas/CompanyRegisteredMetadata'
    ActivityLogInternalUserReference:
      type: object
      additionalProperties: false
      required:
        - internalUserId
        - displayName
      properties:
        internalUserId:
          type: string
          format: uuid
        displayName:
          type: string
    ActivityLogInternalUserTargetReference:
      type: object
      additionalProperties: false
      required:
        - type
        - internalUserId
        - displayName
      properties:
        type:
          type: string
          const: internal_user
        internalUserId:
          type: string
          format: uuid
        displayName:
          type: string
    ActivityLogCompanyTargetReference:
      type: object
      additionalProperties: false
      required:
        - type
        - companyId
        - displayName
      properties:
        type:
          type: string
          const: company
        companyId:
          type: string
          format: uuid
        displayName:
          type: string
    IdentityProvisionedMetadata:
      type: object
      additionalProperties: false
      required:
        - identityProvider
      properties:
        identityProvider:
          type: string
    CompanyRegisteredMetadata:
      type: object
      additionalProperties: false
    RegisterCompanyInput:
      type: object
      additionalProperties: false
      required:
        - displayName
      properties:
        displayName:
          type: string
          minLength: 1
    CompanyRecord:
      type: object
      additionalProperties: false
      required:
        - id
        - workspaceId
        - displayName
        - status
        - createdAt
        - createdByInternalUserId
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        displayName:
          type: string
        status:
          type: string
          const: active
        createdAt:
          type: string
          format: date-time
        createdByInternalUserId:
          type: string
          format: uuid
    ActorContext:
      type: object
      additionalProperties: false
      required:
        - internalUserId
        - workspaceMembershipId
        - workspaceId
        - workspaceName
        - displayName
        - email
        - active
        - workspacePermissions
      properties:
        internalUserId:
          type: string
          format: uuid
        workspaceMembershipId:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        workspaceName:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
        active:
          type: boolean
          const: true
        workspacePermissions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - company.manage
        activeCompany:
          $ref: '#/components/schemas/ActiveCompanyContext'
    ActiveCompanyContext:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
