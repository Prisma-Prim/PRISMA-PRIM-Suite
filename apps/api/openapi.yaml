        '401': { description: No verified External Principal is available. }
        '403':
          description: >-
            The actor lacks live Registrar v3, Document, Representation or Client read authority in the active Company.
        '404':
          description: >-
            The Document, Version or current reference is not visible inside its owning boundary.
        '409':
          description: The revision is stale, the Version is not the draft, the reference is the last current draft reference, or the key was reused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentVersionConflict'
