        workingRevision:
          description: The Document's one concurrency token, shared by every Version command and the working correction.
          type: integer
          format: int32
          minimum: 1
        mutable:
          description: True only while the original Client is active and actively related to the Company.
          type: boolean
        versions:
          description: Every Version, highest number first.
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/DocumentVersion'
    DocumentVersion:
