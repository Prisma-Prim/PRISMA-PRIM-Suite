  /api/documents/{documentId}/correction-history:
    get:
      operationId: listWorkingDocumentCorrectionHistory
      summary: Read a working Document's material corrections with prior and new values
      description: >-
        Authorization and every refusal are identical to the working Document
        detail read and take precedence over query validation; no correction
        or Activity Log read permission is required. Authority, visibility and
        the page share one read snapshot. Only material corrections of this
        Document in the server-validated active Company are returned, newest
        working revision first, at most 20 per page; unchanged retry receipts
        are excluded. Prior title and purpose share the Document metadata
        visibility; a URL change is returned only to a current
        Representation reader and is otherwise omitted, key and values. The
        read changes nothing, records no Activity Log event and never fetches
        a URL.
      tags:
        - Document
      parameters:
        - $ref: '#/components/parameters/RequiredCompanyContextId'
        - in: path
          name: documentId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: beforeRevision
          required: false
          description: >-
            The `nextBeforeRevision` returned by the previous page. Only
            corrections that produced a lower working revision are returned.
            Any other query key fails validation.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 2147483647
      responses:
        '200':
          description: One page of material corrections as recorded; the values are history, not the current Document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkingDocumentCorrectionHistoryPage'
        '400':
          description: The Document id is malformed, `beforeRevision` is not the canonical decimal form of a positive working revision, or another query key is present.
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks current Document read authority or a valid active Company context.
        '404':
          description: No working Document with a readable original Client is visible in the active Company.
  /api/documents/{documentId}/versions:
    get:
      operationId: listDocumentVersions
      summary: Read every formal Version of a working Document with its status and designation
      description: >-
        Authorization and every refusal are identical to the working Document
        detail read; a superseded original Client stays readable. Authority,
        visibility and the Versions share one repeatable-read snapshot. At
        most 50 Versions are returned, highest number first. Each Version
        holds exactly one unverified external reference; its URL is returned
        only to a current Representation reader. Actor labels are existing
        display labels, never emails. Reading writes nothing.
      tags:
        - Document
      parameters:
        - $ref: '#/components/parameters/RequiredCompanyContextId'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: The Document's working revision, whether Version commands are possible, and its Versions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentVersionsRead'
        '400':
          description: The Document id is malformed.
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks current Document read authority or a valid active Company context.
        '404':
          description: No working Document with a readable original Client is visible in the active Company.
    post:
      operationId: startDocumentDraftVersion
      summary: Start a new draft Version copied from the current official Version
      description: >-
        Requires a live Company Document Registrar v3 assignment
        (`document.version.manage`), `document.reference.read`, the Document
        detail read authority and an active original Client related to the
        active Company. The Document must have a current official Version and
        no draft. Version n+1 is created as a draft attributed to the actor,
        holding a new reference with the official Version's URL. The
        command takes the per-actor key lock, then checks live authority,
        visibility and replay, locks the original Client and the Document,
        then checks the working revision and the Version state. One
        transaction writes the Version, increments the working revision by
        exactly one, advances the original Client operational-use fence and
        records one durable receipt and one `document.version.drafted`
        event. An exact replay revalidates current authority and visibility
        and returns the stored receipt.
      tags:
        - Document
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequiredCompanyContextId'
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentVersionCommandInput'
      responses:
        '201':
          description: The draft Version was started, or an exact replay of that command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentVersionDraftedReceipt'
        '400':
          description: The Idempotency-Key is missing, the Document id is malformed, or the body is not exactly `{ expectedRevision }` in range.
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks a live Registrar v3 assignment, Representation read, Document read authority or a valid active Company context.
        '404':
          description: No working Document is visible in the active Company, or its original Client is no longer active or related.
        '409':
          description: >-
            `document_revision_conflict` when `expectedRevision` is stale;
            `document_version_state_invalid` when no official Version exists
            or a draft already exists; `document_version_capacity_exceeded`
            when the Document already holds 50 Versions; or the Document
            key-reuse conflict when the Idempotency-Key was used for another
            Version command. Nothing is written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentVersionConflict'
  /api/documents/{documentId}/versions/{versionId}/official-designation:
    post:
      operationId: designateOfficialDocumentVersion
      summary: Designate the current draft Version as the Document's official Version
      description: >-
        Requires a live Company Document Approver v1 assignment
        (`document.version.designate_official`), the delivered Document read
        authority (any Registrar version, with `document.reference.read`) and
        Client read in the active Company. The Version must be the current
        draft. One transaction makes it official with the actor and server
        time, freezes the Document's current title and purpose onto it with
        its reference, supersedes the previous official Version, if any,
        increments the working revision by exactly one, advances the original
        Client operational-use fence and records one durable receipt and one
        `document.version.designated_official` event. A designated Version
        is never changed again, except the single official to superseded
        transition. An exact replay revalidates current authority and
        visibility and returns the stored receipt.
      tags:
        - Document
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequiredCompanyContextId'
        - $ref: '#/components/parameters/DocumentId'
        - in: path
          name: versionId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentVersionCommandInput'
      responses:
        '200':
          description: The draft Version was designated official, or an exact replay of that command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentVersionDesignatedReceipt'
        '400':
          description: The Idempotency-Key is missing, an identifier is malformed, or the body is not exactly `{ expectedRevision }` in range.
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks a live Approver v1 assignment, Document read authority, Representation read or a valid active Company context.
        '404':
          description: No working Document is visible in the active Company, the Version belongs to another Document, or the original Client is no longer active or related.
        '409':
          description: >-
            `document_revision_conflict` when `expectedRevision` is stale;
            `document_version_state_invalid` when the Version is not the
            current draft; or the Document key-reuse conflict when the
            Idempotency-Key was used for another Version command. Nothing is
            written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentVersionConflict'
