        '403':
          description: The actor lacks the live Approver, Project read or Client read.
        '404':
          description: The Project is not visible, or its original Client is superseded.
  /api/projects/{projectId}/lifecycle-transitions:
    post:
      operationId: transitionProjectLifecycle
      summary: Transition or close a Project at its observed lifecycle revision
      description: >-
        Activation, hold and resume require a live Company Project Approver v1
        `project.lifecycle.transition`; completion and cancellation require the
        same live assignment with `project.close`. Every action also requires
        Project detail read and Client read. One transaction takes the
        per-actor key lock, checks live authority and visibility, resolves an
        exact replay, locks the original Client identity then relationship and
        the Project row, and checks the revision and state. A commit writes the
        status and revision, the transition record (plus the immutable start
        declaration on activation), one durable receipt, exactly one
        `project.lifecycle.changed` event and the original Client
        operational-use fence advance. An exact replay first revalidates live
        authority and visibility and then returns the recorded body without any
        new write. No transition changes a Task, Document association, Request
        or responsible member. Completion and cancellation are refused while
        any Task is still open.
      tags:
        - Project
      parameters:
        - $ref: '#/components/parameters/RequiredCompanyContextId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectLifecycleTransitionCommand'
      responses:
        '200':
          description: The committed transition, or the recorded result of an exact replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectLifecycleReceipt'
        '400':
          description: >-
            The key is missing; the action is unknown; a body key is missing or
            unknown; an identifier, reason, note, date or declaration value is
            malformed; a start exception is present with no missing item or
            absent with one; or the completion member is unavailable.
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks the live Approver, Project read or Client read.
        '404':
          description: The Project is not visible, or its original Client is superseded.
        '409':
          description: >-
            `project_lifecycle_conflict` for a stale or exhausted revision,
            `project_lifecycle_transition_invalid` for a source status the
            action does not leave, `project_responsible_required` for an
            activation without a responsible member, `project_open_tasks` when
            completion or cancellation still has an open Task, or a plain
            conflict when the Idempotency-Key was already used for another
            Project, action or body. Nothing is written.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ProjectLifecycleConflict'
                  - $ref: '#/components/schemas/GenericConflict'
  /api/offers/opportunities/{opportunityId}:
    get:
      operationId: readOpportunityOffer
      summary: Read the exact illustrative Offer Version for one Opportunity
      description: >-
        Requires the live Offer read, Opportunity read and applicable Client
        visibility in the active Company. The response is scoped to the
        current Workspace and Company and uses the same safe not-found for an
        unknown or hidden Opportunity. When an Offer exists, its version binds
        the persisted `OFFER_ILLUSTRATIVE` Template and
        `OFFER_QUALITY_ILLUSTRATIVE` rule set, both v1 for an unadjusted
        Pricing Snapshot and both v2 when any Snapshot line carries a fixed net
        discount, and returns deterministic English HTML plus the lowercase
        SHA-256 checksum of those exact UTF-8 bytes. Rendering uses only the
        immutable copied Offer fields and its immutable Pricing Snapshot,
        never repricing it. The read creates no command,
        Offer event, Activity event, file or provider side effect and changes
        no Offer revision.
      tags:
        - Offer
      parameters:
        - $ref: '#/components/parameters/RequiredCompanyContextId'
        - in: path
          name: opportunityId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The readable Offer and its exact version, or null when the readable Opportunity has no Offer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferDetail'
        '401':
          description: No verified External Principal is available.
        '403':
          description: >-
            No valid active Company context, or the actor lacks the live Offer,
            Opportunity or applicable Client read required by the delivered
            Offer boundary.
        '404':
          description: No readable Opportunity matches the malformed, unknown or cross-scope identifier.
  /api/operational-home:
    get:
      operationId: readOperationalHome
      summary: Count the active Company records the reader can open
      description: >-
        Operational Dashboard PRD section 17. The read samples the server clock
        once; `today` is that instant's calendar date in `Europe/Chisinau` and
        every date comparison uses it. The counts come from one repeatable-read
        snapshot. A summary appears only when the reader holds, in the active
        Company, the read that owns its records, evaluated live exactly as that
        read evaluates it; otherwise it is absent, never zero. Each count equals
        the number of records its drill-down lists for the same reader and
        state. The read records no Activity Log event, command receipt, version
        or Client fence advance.
      tags:
        - Operational home
      parameters:
        - $ref: '#/components/parameters/RequiredCompanyContextId'
      responses:
        '200':
          description: The Company summaries the reader may read, in the fixed kind order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalHome'
        '400':
          description: A query parameter is present; the read takes none.
        '401':
          description: No verified External Principal is available.
        '403':
          description: >-
            No valid active Company context, or the reader holds none of the
            Client directory, Project list and Task reads in the active
            Company. The body is the delivered safe denial.
  /api/overdue-tasks:
