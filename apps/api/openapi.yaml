        - projectPlan
        - initialDocuments
        - deadlines
        - financialConditions
        - risks
      properties:
        approvedOffer:
          $ref: '#/components/schemas/ProjectStartDeclarationValue'
        contractOrPrecontract:
          $ref: '#/components/schemas/ProjectStartDeclarationValue'
        projectPlan:
