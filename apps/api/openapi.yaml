    get:
      operationId: readTaskResult
      summary: Read the current exact mission Task result
      description: >-
        Requires live Task, Project, original Client, Document metadata,
        mission-family and content-Reader authority. Recorder is not required.
        An authorized empty stream is revision zero/current null; denied results
        never disclose existence. Reads use a repeatable-read snapshot. No result
        facts are projected into ordinary Task DTOs/history or general Activity.
