  /api/projects/{projectId}/lifecycle:
    get:
      operationId: readProjectLifecycle
      summary: Read a Project's lifecycle status, start declaration and transition history
      description: >-
        Project/Task PRD section 23. Requires exactly the Project detail read;
        authority, visibility and the read share one repeatable-read snapshot,
        and every refusal returns the status and safe body of
        `GET /api/projects/{projectId}`. A superseded original Client stays
        readable with `mutable: false`. Reading writes nothing.
      tags:
        - Project
      parameters:
        - $ref: '#/components/parameters/RequiredCompanyContextId'
        - $ref: '#/components/parameters/ProjectId'
