          name: workspaceMembershipId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: companyId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The revoked canonical Company Document Approver assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDocumentApproverAssignment'
        '400':
          description: A target or idempotent command is invalid.
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks assignment authority or the assignment is outside the current Workspace.
  /api/company-task-result-recorder-assignments:
    post:
      operationId: grantCompanyDocumentTaskResultRecorderAssignment
      summary: Grant the opt-in Company Task Result Recorder v1 bundle to an active Workspace Membership
      description: >-
        Requires company.assignment.manage. Explicitly grants exactly
        task.result.record in captured v1, independently of all Task/Project/Client,
        Document metadata, mission-family and PDF content prerequisites. Existing
        assignments and migration grant nothing. Actual grant records one minimal
        bundle-label event; repeated commands and exact replay record none.
      tags:
        - Access
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantCompanyContextAssignmentInput'
      responses:
        '201':
          description: The active canonical Company Task Result Recorder assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyTaskResultRecorderAssignment'
        '400':
          description: A target or idempotent command is invalid.
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks assignment authority or a target is not active in the current Workspace.
  /api/company-task-result-recorder-assignments/{workspaceMembershipId}/{companyId}:
    delete:
      operationId: revokeCompanyDocumentTaskResultRecorderAssignment
      summary: Revoke the Company Task Result Recorder assignment
      description: >-
