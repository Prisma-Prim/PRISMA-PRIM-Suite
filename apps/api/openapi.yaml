      type: object
      additionalProperties: false
      required: [uploads, nextBeforeRevision]
      properties:
        uploads:
          type: array
          maxItems: 20
          items:
            allOf:
              - $ref: '#/components/schemas/DocumentPreservedPdf'
              - type: object
                required: [current]
                properties:
                  current: { type: boolean }
            unevaluatedProperties: false
        nextBeforeRevision:
          oneOf:
            - { type: 'null' }
            - { type: integer, minimum: 2, maximum: 2147483647 }
