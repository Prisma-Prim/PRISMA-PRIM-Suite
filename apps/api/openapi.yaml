            clarify_request:
              { $ref: '#/components/schemas/NormalizedTemplateTaskTitle' }
            confirm_scope:
              { $ref: '#/components/schemas/NormalizedTemplateTaskTitle' }
            collect_questionnaire:
              { $ref: '#/components/schemas/NormalizedTemplateTaskTitle' }
            prepare_plan:
              { $ref: '#/components/schemas/NormalizedTemplateTaskTitle' }
    NormalizedTemplateTaskTitle:
      type: string
