    SupersededDocumentVersion:
      type: object
      additionalProperties: false
      required:
        [
          id,
          number,
          status,
          createdAt,
          createdBy,
          representations,
          pdfContent,
          designatedAt,
          designatedBy,
          frozen,
          supersededAt,
          supersededByVersionNumber,
        ]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          minimum: 1
          maximum: 50
        status:
          type: string
          const: superseded
        createdAt:
          type: string
          format: date-time
        createdBy:
          $ref: '#/components/schemas/DocumentActorLabel'
        pdfContent:
