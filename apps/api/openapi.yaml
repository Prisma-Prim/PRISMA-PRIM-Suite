    DocumentPreservedPdf:
      type: object
      required:
        [
          representationId,
          revision,
          fileName,
          mediaType,
          size,
          sha256,
          storedAt,
          storedBy,
          scan,
        ]
      properties:
        representationId: { type: string, format: uuid }
        revision: { type: integer, minimum: 2, maximum: 2147483647 }
        fileName: { type: string, minLength: 5, maxLength: 120 }
        mediaType: { type: string, const: application/pdf }
        size: { type: integer, minimum: 1, maximum: 5242880 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        storedAt: { type: string, format: date-time }
        storedBy: { $ref: '#/components/schemas/DocumentActorLabel' }
        scan:
          type: object
          additionalProperties: false
          required: [outcome, engine, scannedAt]
          properties:
            outcome: { type: string, const: clean }
            engine: { type: string, minLength: 1, maxLength: 200 }
            scannedAt: { type: string, format: date-time }
    DocumentPdfContent:
      oneOf:
        - type: object
          additionalProperties: false
          required: [state]
          properties:
            state: { type: string, const: absent }
        - type: object
          additionalProperties: false
          required: [state, access]
          properties:
            state: { type: string, const: stored }
            access: { type: string, const: denied }
        - allOf:
            - $ref: '#/components/schemas/DocumentPreservedPdf'
            - type: object
              required: [state, access]
              properties:
                state: { type: string, const: stored }
                access: { type: string, const: granted }
          unevaluatedProperties: false
