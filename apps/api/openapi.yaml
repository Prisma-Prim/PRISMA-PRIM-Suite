  /api/projects/{projectId}/pdf-bundle:
    post:
      operationId: downloadSelectedProjectPdfs
      summary: Collect exact selected stored Project PDFs in one bounded factual ZIP
      description: >-
        Pure read with no command receipt or idempotency key. Requires native live Project,
        original Client, Document metadata, independent family and Content Reader authority.
        One repeatable-read read-only snapshot validates the complete ordered selection,
        exact association revisions and Version/Representation identities before releasing bytes.
        Historical Versions and earlier draft uploads remain exact; no latest substitution.
        Contains only byte-identical stored PDFs and UTF-8 manifest.json formatVersion 1,
        purpose SELECTED_PROJECT_PDFS, actual server UTC preparedAt, original projectId,
        companyId, clientId and ordered entries (path, documentId, current title, versionId,
        versionNumber, native versionStatus, representationId, originalFileName, byteSize, sha256).
        Server ASCII paths combine position and exact Document/Version identities. Stored entries,
        at most 20 MiB PDF sum and 21 MiB complete ZIP. No partial success, persistence,
        new scan, external fetch, sending, approval or dossier-completeness assertion.
      tags: [Document]
      parameters:
        - $ref: '#/components/parameters/RequiredCompanyContextId'
        - in: path
          name: projectId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 20
                  description: Ordered unique Document/Version pairs; different Versions of one Document are allowed.
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      [
                        documentId,
                        versionId,
                        representationId,
                        expectedProjectRevision,
                      ]
                    properties:
                      documentId: { type: string, format: uuid }
                      versionId: { type: string, format: uuid }
                      representationId: { type: string, format: uuid }
                      expectedProjectRevision:
                        { type: integer, minimum: 0, maximum: 2147483647 }
      responses:
        '200':
          description: All exact selected originals and factual index; no business effects.
          headers:
            Content-Disposition:
              schema:
                {
                  type: string,
                  const: 'attachment; filename="selected-project-pdfs.zip"',
                }
            Cache-Control:
              schema: { type: string, const: 'private, no-store' }
            X-Content-Type-Options:
              schema: { type: string, const: nosniff }
          content:
            application/zip:
              schema: { type: string, format: binary }
        '400':
          description: Malformed body, identity, revision, repeated Document/Version pair or selection outside 1–20.
        '401':
          description: Verified current identity is required.
        '403':
          description: Current ordinary Project, Document, Client or Content Reader authority is missing.
        '404':
          description: A selected scoped association, Version, Representation or independently gated family is not readable.
        '409':
          description: An authorized association revision changed; explicitly reload and reselect.
        '413':
          description: PDF sum exceeds 20 MiB or complete ZIP exceeds 21 MiB.
        '503':
          description: Preserved content is damaged or unavailable; no partial archive.
  /api/documents/{documentId}/versions/{versionId}/content:
    parameters:
      - in: path
        name: documentId
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: versionId
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: preserveDocumentQuestionnairePdf
      summary: Preserve a clean PDF in a mutable questionnaire draft
      description: >-
        Requires live Company context, Client read, Document metadata read,
        Registrar v3 Version management and separate Content Reader and Content
        Uploader v1 assignments. Scans before the atomic commit, then rechecks
        all authority, original Client state, exact revision and draft status.
        Every upload appends immutable bytes and provenance; a draft replacement
        preserves every prior upload. Official content cannot be replaced.
        An exact successful replay returns its original receipt without a new
        scan, revision, Activity event or change to the current PDF.
      tags: [Documents]
      parameters:
        - $ref: '#/components/parameters/RequiredCompanyContextId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: query
          name: expectedRevision
          required: true
          schema: { type: integer, minimum: 1, maximum: 2147483646 }
        - in: query
          name: fileName
          required: true
          schema: { type: string, minLength: 5, maxLength: 120 }
          description: Trimmed PDF filename ending in .pdf; no slash, backslash, control or format characters.
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary, maxLength: 5242880 }
      responses:
        '201':
          description: Durable representation_added receipt; original receipt on exact replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentRepresentationAddedReceipt'
        '400':
          description: Invalid PDF, unsafe filename, idempotent command or failed malware scan.
        '401': { description: No verified identity. }
        '403': { description: Missing or revoked live authority. }
        '404':
          { description: Document or Version is not visible in this scope. }
        '409':
          description: Stale revision, conflicting replay or non-draft Version.
        '413': { description: Actual bytes or Content-Length exceed 5 MiB. }
        '503':
          description: Scanner is unconfigured, unavailable or did not prove clean content.
    get:
      operationId: downloadCurrentDocumentQuestionnairePdf
      summary: Download the current preserved PDF of this exact Version
      description: >-
        Requires separate live Content Reader v1 authority in addition to Company,
        Client and Document metadata read. Returns byte-exact application/pdf with
        attachment filename, private no-store and nosniff. Metadata alone grants
        no content access. No public or signed storage URL is returned.
      tags: [Documents]
      parameters:
        - $ref: '#/components/parameters/RequiredCompanyContextId'
      responses:
        '200':
          description: Current immutable PDF bytes.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { description: No verified identity. }
        '403': { description: Missing or revoked live content authority. }
        '404':
          {
            description: No preserved PDF visible at this exact scope and Version.,
          }
        '503':
          { description: Preserved content integrity could not be verified. }
