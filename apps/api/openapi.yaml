    ActiveCompanyContext:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
        - clientPermissions
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        clientPermissions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - client.read
              - client.create
              - client.update
              - client.duplicate.resolve
        clientPermissionAssignmentId:
          type: string
          format: uuid
        clientPermissionSetVersion:
          type: string
          enum:
            - v1
            - v2
        documentPermissions:
          type: array
          uniqueItems: true
          description: Current captured Document permissions; content grants never expand metadata or Version-management authority.
          items:
            type: string
            enum:
              - document.read
              - document.register
              - document.reference.read
              - document.correct
              - document.project.manage
              - document.version.manage
              - document.version.designate_official
              - document.content.read
              - document.content.upload
        documentContentReaderAssignmentId:
          type: string
          format: uuid
        documentContentReaderPermissionSetVersion:
          type: string
          const: v1
        documentContentUploaderAssignmentId:
          type: string
          format: uuid
        documentContentUploaderPermissionSetVersion:
          type: string
          const: v1
        projectStagePermissions:
          type: array
          uniqueItems: true
          maxItems: 1
          items: { type: string, const: project.stage.advance }
        projectStagePermissionAssignmentId: { type: string, format: uuid }
        projectStagePermissionSetVersion: { type: string, const: v1 }
        projectTemplateConfigurationPermissions:
          type: array
          uniqueItems: true
          maxItems: 1
          items: { type: string, const: project.template.version.create }
        projectTemplateConfigurationPermissionAssignmentId:
          { type: string, format: uuid }
        projectTemplateConfigurationPermissionSetVersion:
          { type: string, const: v1 }
        projectTemplatePermissions:
          type: array
          uniqueItems: true
          maxItems: 4
          items:
            type: string
            enum:
              - project.template.read
              - project.template.instantiate
              - project.template.pilot.read
              - project.template.pilot.instantiate
          description: >-
            Captured v1 preserves only generic read/instantiate. Explicit revoke/regrant captures v2 and adds pilot.read/pilot.instantiate; neither confers
            independent Project, Task, stage, publishing or lifecycle authority.
        projectTemplatePermissionAssignmentId:
          type: string
          format: uuid
        projectTemplatePermissionSetVersion:
          type: string
          enum: [v1, v2]
        projectPermissions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - project.read
              - project.create
              - project.update
        taskPermissions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - task.read
              - task.manage
        taskPermissionAssignmentId:
          type: string
          format: uuid
        taskPermissionSetVersion:
          type: string
          const: v1
        projectPermissionAssignmentId: { type: string, format: uuid }
        projectPermissionSetVersion: { type: string, enum: [v1, v2] }
        documentPermissionAssignmentId: { type: string, format: uuid }
        taskResultPermissions:
          type: array
          uniqueItems: true
          items: { type: string, const: task.result.record }
        taskResultRecorderAssignmentId: { type: string, format: uuid }
        taskResultRecorderPermissionSetVersion: { type: string, const: v1 }
        projectApproverPermissions:
          type: array
          uniqueItems: true
          description: Present only while a live captured Company Project Approver v1 assignment exists in the active Company.
          items:
            type: string
            enum:
              - project.lifecycle.transition
              - project.close
        projectApproverPermissionAssignmentId:
          type: string
          format: uuid
        projectApproverPermissionSetVersion:
          type: string
          const: v1
    ClientUnionDossier:
      type: object
      additionalProperties: false
      required:
        - id
        - version
        - displayName
        - taxId
        - address
        - telephone
        - generalEmail
        - businessActivity
        - contacts
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
          maximum: 2147483647
        displayName:
          type: string
        taxId:
          type:
            - string
            - 'null'
        address:
          type:
            - string
            - 'null'
        telephone:
          type:
            - string
            - 'null'
        generalEmail:
          type:
            - string
            - 'null'
        businessActivity:
          type:
            - string
            - 'null'
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/ClientContact'
          maxItems: 50
    ClientUnionProjection:
      type: object
      additionalProperties: false
      required:
        - action
        - projectionReference
        - companyId
        - actor
        - target
      properties:
        action:
          enum:
            - client.union_confirmed
            - client.union_reversed
        projectionReference:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        actor:
          type: object
          additionalProperties: false
          required:
            - kind
          properties:
            kind:
              const: authorized_resolver
        target:
          type: object
          additionalProperties: false
          required:
            - type
            - projectionReference
            - companyId
          properties:
            type:
              const: client_union_operation
            projectionReference:
              type: string
              format: uuid
            companyId:
              type: string
              format: uuid
      description:
        An immutable Company projection, ordered by its independently generated
        public reference. No internal operation ID, actor identity, timestamp, time bucket,
        reason, foreign Company, or hidden Client data is returned.
    ClientUnionComparison:
      type: object
      additionalProperties: false
      required:
        - outcome
        - reviewReference
        - clients
        - companies
        - fields
        - identityBasis
      properties:
        outcome:
          const: comparison
        reviewReference:
          type: string
          format: uuid
        clients:
          type: array
          items:
            $ref: '#/components/schemas/ClientUnionDossier'
          minItems: 2
          maxItems: 2
        companies:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - displayName
            properties:
              id:
                type: string
                format: uuid
              displayName:
                type: string
          minItems: 1
        fields:
          type: array
          const:
            - displayName
            - taxId
            - address
            - telephone
            - generalEmail
            - businessActivity
        identityBasis:
          type: object
          additionalProperties: false
          required:
            - kind
            - identifier
          properties:
            kind:
              const: exact_tax_identifier
            identifier:
              type: string
              minLength: 1
    ClientUnionRemediation:
      type: object
      additionalProperties: false
      required:
        - outcome
      properties:
        outcome:
          const: multiple_duplicate_candidates_require_data_remediation
    ClientUnionReview:
      oneOf:
        - $ref: '#/components/schemas/ClientUnionComparison'
        - $ref: '#/components/schemas/ClientUnionRemediation'
    ClientUnionConfirmation:
      type: object
      additionalProperties: false
      required:
        - canonicalClientId
        - fields
        - companyIds
        - reviewedDifferences
        - reason
      properties:
        canonicalClientId:
          type: string
          format: uuid
        fields:
          type: object
          additionalProperties: false
          required:
            - displayName
            - taxId
            - address
            - telephone
            - generalEmail
            - businessActivity
          properties:
            displayName:
              type: string
              format: uuid
            taxId:
              type: string
              format: uuid
            address:
              type: string
              format: uuid
            telephone:
              type: string
              format: uuid
            generalEmail:
              type: string
              format: uuid
            businessActivity:
              type: string
              format: uuid
        companyIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          uniqueItems: true
        reviewedDifferences:
          const: true
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      description:
        Select each scalar from one of the two reviewed Client IDs and confirm
        every affected Company. All Contacts are retained as separate entries with source
        provenance; more than 50 combined Contacts blocks atomically. Document-derived
        evidence and additional fields are rejected.
    ClientUnionConfirmed:
      type: object
      additionalProperties: false
      required:
        - outcome
        - canonicalClientId
        - projectionReference
      properties:
        outcome:
          const: united
        canonicalClientId:
          type: string
          format: uuid
        projectionReference:
          type: string
          format: uuid
    ClientUnionReversal:
      type: object
      additionalProperties: false
      required:
        - companyIds
        - reason
      properties:
        companyIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          uniqueItems: true
        reason:
          type: string
          minLength: 1
          maxLength: 2000
    ClientUnionReversed:
      type: object
      additionalProperties: false
      required:
        - outcome
        - clientIds
      properties:
        outcome:
          const: reversed
        clientIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 2
          maxItems: 2
          uniqueItems: true
    ClientUnionHistory:
      type: object
      additionalProperties: false
      required:
        - events
        - detailReferences
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/ClientUnionProjection'
          maxItems: 100
        detailReferences:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 100
          uniqueItems: true
      description:
        Company-local random-reference ordering. A reference appears in detailReferences
        only after complete current resolver authority passes for the captured scope.
    ClientUnionDetail:
      type: object
      additionalProperties: false
      required:
        - operationId
        - projectionReference
        - targetType
        - state
        - canonicalClientId
        - originals
        - companies
        - identityBasis
        - reason
        - occurredAt
        - actor
        - contactSources
        - reversal
        - canReverse
      properties:
        operationId:
          type: string
          format: uuid
        projectionReference:
          type: string
          format: uuid
        targetType:
          const: client_union_operation
        state:
          enum:
            - united
            - reversed
        canonicalClientId:
          type: string
          format: uuid
        originals:
          type: array
          items:
            $ref: '#/components/schemas/ClientUnionDossier'
          minItems: 2
          maxItems: 2
        companies:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - displayName
            properties:
              id:
                type: string
                format: uuid
              displayName:
                type: string
          minItems: 1
        identityBasis:
          type: object
          additionalProperties: false
          required:
            - kind
            - identifier
          properties:
            kind:
              const: exact_tax_identifier
            identifier:
              type: string
              minLength: 1
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        occurredAt:
          type: string
          format: date-time
        actor:
          type: object
          additionalProperties: false
          required:
            - internalUserId
            - displayName
          properties:
            internalUserId:
              type: string
              format: uuid
            displayName:
              type: string
        contactSources:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - clientId
              - version
              - index
            properties:
              clientId:
                type: string
                format: uuid
              version:
                type: integer
                minimum: 1
              index:
                type: integer
                minimum: 0
          maxItems: 50
        reversal:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required:
                - reason
                - occurredAt
                - actor
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 2000
                occurredAt:
                  type: string
                  format: date-time
                actor:
                  type: object
                  additionalProperties: false
                  required:
                    - internalUserId
                    - displayName
                  properties:
                    internalUserId:
                      type: string
                      format: uuid
                    displayName:
                      type: string
        canReverse:
          type: boolean
      description:
        Requires current Client read and captured resolver-enabled v2 authority
        in every captured Company. Internal ID and exact attribution are disclosed only
        here. Reversal appends its own reason and preserves the original reason.

    CompanyProjectStageAdvancerAssignment:
