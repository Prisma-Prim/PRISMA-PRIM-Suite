      responses:
        '200':
          description: Target identity/title, ordinary Task version, result revision, mutability and the exact current declaration or null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResultSnapshot'
        '401': { description: No verified identity. }
        '403':
          {
            description: Invalid Company context or missing ordinary Task authority.,
          }
        '404':
          {
            description: The combined Task and Document resource is unavailable.,
          }
    post:
      operationId: recordTaskResult
      summary: Deliberately record the first exact frozen mission Task result
      description: >-
        Requires captured Company Task Result Recorder v1, task.manage and every
        live read prerequisite. New intent requires an open Task/Project, active
        exact original Client/relationship and a currently associated same-scope
        mission Version. Documents resolves its current clean frozen PDF. The
        declaration, restricted revision-only event, receipt and Client fence
        commit atomically without changing ordinary Task state/version. Authority
        and recorded endpoints precede committed replay of historical observations.
      tags: [Task]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskResultRecordInput'
      responses:
        '201':
          description: Immutable minimal receipt, including an exact committed replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResultReceipt'
        '400':
          description: Malformed fields, limits, observations or idempotency key.
        '401': { description: No verified identity. }
        '403':
          {
            description: Missing live command authority or invalid Company context.,
          }
        '404':
          { description: Unavailable Task or exact eligible Document Version. }
        '409':
          description: Stale observations, closed Task/Project, existing result or conflicting key reuse.
  /api/tasks/{taskId}/results/corrections:
    post:
      operationId: correctTaskResult
      summary: Append a reasoned successor without rewriting the preceding Task result
      description: >-
        Uses the same live authority, new-intent state, exact-reference,
        serialization and dedicated receipt rules as first recording. Requires
        the exact observed current result revision. Normalized unchanged text
        and reference confirm a no-op without declaration/event/revision/fence
        changes. A material successor preserves its predecessor; exhausted
