  /api/project-templates/{templateKey}/versions:
    post:
      operationId: publishIllustrativeProjectTemplateSuccessor
      summary: Create and immediately publish one immutable compatible Company successor
      description: >-
        Requires captured Company Project Template Configuration v1 plus independent current
        Company context, Project read and Template read; requires no Client or Task authority.
        Changes only the four normalized required Task titles, with at least one differing
        from the exact observed source/head. The server assigns the next canonical Version.
        Content, immutable lineage, head, receipt and one minimal Company Version event commit
        together; no Client fence advances and no existing Project copy or history changes.
        Actor/Workspace idempotency covers Company, source/head and all four normalized titles.
        Live authority is rechecked and an identical committed receipt is resolved before the
        old expected head. Different concurrent intentions from one head yield one successor
        and one definite stale conflict requiring explicit reload; there is no implicit rebase.
      tags: [Project templates]
      parameters:
        - $ref: '#/components/parameters/RequiredCompanyContextId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: templateKey
          required: true
          schema: { type: string, const: CONSULTING_PREPARATION_ILLUSTRATIVE }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: '#/components/schemas/PublishProjectTemplateVersionInput',
              }
      responses:
        '201':
          description: The committed publication receipt, or the identical original receipt on authorized retry.
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/ProjectTemplateVersionReceipt' }
        '400':
          description: Malformed, unchanged, overflowing or incompatible publication intent.
        '401': { description: No verified External Principal. }
        '403':
          {
            description: Dedicated publication or independent catalogue authority is missing.,
          }
        '409':
          description: Exact stale head or changed intention under an existing key.
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties:
                  code:
                    {
                      type: string,
                      enum:
                        [
                          template_publication_stale_head,
                          template_publication_key_conflict,
                        ],
                    }
  /api/projects/from-template:
    post:
      operationId: createProjectFromIllustrativeTemplate
      summary: Atomically create a preparatory Project with the chosen model Task copies
      description: >-
        Requires the dedicated captured Template User v1 or v2 for legacy copies; the primary pilot requires v2 pilot.read and pilot.instantiate in addition to generic read/instantiate and current independent
        Project creation, Task Manager and active original Client relationship
        authority. Exact actor/Workspace replay revalidates authority and confirms
        the original Project identity using current Project display facts; changed
        key reuse conflicts. A new creation records one ordinary Project creation
        and four legacy or thirteen pilot ordinary Task creation events in the same transaction. No existing
        Project is retrofitted. No stage advancement, publishing or operational
        activation occurs.
