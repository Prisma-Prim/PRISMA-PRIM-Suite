          type: string
          format: uuid
        workspaceMembershipId:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        workspaceName:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
        active:
          type: boolean
          const: true
        workspacePermissions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - company.manage
              - company.assignment.manage
              - client.manage
        activeCompany:
          $ref: '#/components/schemas/ActiveCompanyContext'
    ActiveCompanyContext:
      type: object
      additionalProperties: false
      required:
        - id
