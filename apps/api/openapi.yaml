        number:
          type: integer
          minimum: 1
          maximum: 50
        status:
          type: string
          const: draft
        createdAt:
          type: string
          format: date-time
        createdBy:
          $ref: '#/components/schemas/DocumentActorLabel'
        pdfContent:
          $ref: '#/components/schemas/DocumentPdfContent'
        representations:
          $ref: '#/components/schemas/DocumentVersionReferences'
