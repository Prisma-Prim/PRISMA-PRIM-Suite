    ProjectStageRequiredTask:
      {
        'type': 'object',
        'additionalProperties': false,
        'required': ['taskId', 'key', 'title', 'required', 'status', 'version'],
        'properties':
          {
            'taskId': { 'type': 'string', 'format': 'uuid' },
            'key':
              { 'type': 'string', 'pattern': '^[A-Za-z][A-Za-z0-9_]{0,99}$' },
            'title': { 'type': 'string', 'minLength': 1, 'maxLength': 200 },
            'required': { 'type': 'boolean', 'const': true },
            'status':
              {
                'type': 'string',
                'enum': ['todo', 'in_progress', 'blocked', 'done', 'cancelled'],
              },
            'version':
              { 'type': 'integer', 'minimum': 1, 'maximum': 2147483647 },
          },
      }

    ProjectStageProgress:
      {
        'type': 'object',
        'additionalProperties': false,
        'required':
          [
            'currentStageKey',
            'currentStageTitle',
            'stageRevision',
            'nextStage',
            'requiredTasks',
            'gate',
            'canAdvance',
            'transitions',
          ],
        'properties':
          {
            'currentStageKey':
              { 'type': 'string', 'enum': ['scoping', 'preparation'] },
            'currentStageTitle':
              { 'type': 'string', 'minLength': 1, 'maxLength': 200 },
            'stageRevision': { 'type': 'integer', 'enum': [0, 1] },
            'nextStage':
              {
                'oneOf':
                  [
                    {
                      'type': 'object',
                      'additionalProperties': false,
                      'required': ['key', 'title'],
                      'properties':
                        {
                          'key': { 'type': 'string', 'const': 'preparation' },
                          'title':
                            {
                              'type': 'string',
                              'minLength': 1,
                              'maxLength': 200,
                            },
                        },
                    },
                    { 'type': 'null' },
                  ],
              },
            'requiredTasks':
              {
                'type': 'array',
                'minItems': 2,
                'maxItems': 2,
                'items':
                  { '$ref': '#/components/schemas/ProjectStageRequiredTask' },
              },
            'gate':
              {
                'type': 'string',
                'enum':
                  [
                    'required_tasks_incomplete',
                    'advance_authority_required',
                    'project_closed',
                    'original_client_inactive',
                    'last_supported_stage',
                    'ready',
                  ],
              },
            'canAdvance': { 'type': 'boolean' },
            'transitions':
              {
                'type': 'array',
                'maxItems': 1,
                'items':
                  { '$ref': '#/components/schemas/ProjectStageTransition' },
              },
          },
      }

