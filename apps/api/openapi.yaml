        id:
          type: string
          format: uuid
        displayName:
          type: string
        clientPermissions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - client.read
              - client.create
              - client.update
              - client.duplicate.resolve
        clientPermissionAssignmentId:
          type: string
          format: uuid
        clientPermissionSetVersion:
          type: string
          enum:
