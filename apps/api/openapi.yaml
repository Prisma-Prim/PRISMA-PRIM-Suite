openapi: 3.1.0
info:
  title: PRISMA-PRIM Suite API
  version: 0.1.0
paths:
  /api/access/current-actor:
    get:
      operationId: getCurrentActor
      summary: Resolve the verified external identity to the current Internal User
      tags:
        - Access
      parameters:
        - $ref: '#/components/parameters/CompanyContextId'
      responses:
        '200':
          description: The active local actor and persistent Workspace context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorContext'
        '401':
          description: No verified External Principal is available.
        '403':
          description: The principal has no active authority or the requested Company context is invalid.
  /api/activity-log:
    get:
      operationId: listCurrentWorkspaceActivity
      summary: List visible Activity Log events for the current Workspace
      tags:
        - Accountability
      parameters:
        - $ref: '#/components/parameters/CompanyContextId'
      responses:
        '200':
          description: Up to 50 ordinary events in reverse chronological order, followed by up to 50 Company union projections ordered by independently generated public references.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - events
                properties:
                  events:
                    type: array
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/ActivityLogEvent'
        '401':
          description: No verified External Principal is available.
        '403':
          description: The principal has no active authority or the requested Company context is invalid.
  /api/companies:
    get:
      operationId: listVisibleCompanies
      summary: List active Companies visible to the actor in the current Workspace
      tags:
        - Company
      parameters:
        - $ref: '#/components/parameters/CompanyContextId'
      responses:
        '200':
          description: Active visible Companies ordered by display name and identifier.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompanyRecord'
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks Company visibility or the requested Company context is invalid.
    post:
      operationId: registerCompany
      summary: Register one provider Company in the actor's Workspace
      tags:
        - Company
      parameters:
        - $ref: '#/components/parameters/CompanyContextId'
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCompanyInput'
      responses:
        '201':
          description: The registered active provider Company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyRecord'
        '400':
          description: The Company display name or idempotency key is blank or missing, or the idempotency key was already used for a different registration command.
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks Company administration or the requested Company context is invalid.
  /api/companies/{companyId}:
    get:
      operationId: getCompany
      summary: Read one provider Company in the actor's Workspace
      tags:
        - Company
      parameters:
        - $ref: '#/components/parameters/CompanyContextId'
        - in: path
          name: companyId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The Workspace-owned provider Company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyRecord'
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks Company visibility or the requested Company context is invalid.
        '404':
          description: No visible Company matches the identifier in the actor's Workspace.
  /api/company-context-assignments/administration:
    get:
      operationId: readCompanyAccessAdministration
      summary: List active human-readable targets and canonical Company access assignments
      tags:
        - Access
      responses:
        '200':
          description: Active same-Workspace members and Companies plus current assignments for the two approved Company access bundles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyAccessAdministrationState'
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks Company-access administration authority.
  /api/workspace-session-revocations:
    get:
      operationId: listWorkspaceSessionRevocations
      summary: Inspect provider revocation for suspended Workspace members
      description: Requires current company.assignment.manage authority. Returns at most 50 safe records in command-ID order. An abandoned 30-second lease is presented as retry_required. No provider subjects, session IDs or errors are returned.
      tags: [Access]
      parameters:
        - in: query
          name: after
          schema: { type: string, format: uuid }
          description: Continuation cursor from the preceding page.
      responses:
        '200':
          description: Current safe revocation states.
          content:
            application/json:
              schema:
                type: object
                required: [records, nextCursor]
                properties:
                  records:
                    type: array
                    maxItems: 50
                    items:
                      type: object
                      required: [workspaceMembershipId, displayName, status]
                      properties:
                        workspaceMembershipId: { type: string, format: uuid }
                        displayName: { type: string }
                        status:
                          type: string
                          enum: [pending, running, retry_required, complete]
                  nextCursor:
                    type: [string, 'null']
                    format: uuid
        '400':
          description: Invalid cursor.
        '401':
          description: No verified identity.
        '403':
          description: No current Workspace access-administration authority.
  /api/workspace-session-revocations/{workspaceMembershipId}/retry:
    post:
      operationId: retryWorkspaceSessionRevocation
      summary: Retry provider revocation after a committed suspension
      description: Requires current company.assignment.manage authority and a same-Workspace committed suspension. At most one attempt per 30 seconds; completed attempts are no-ops. An acknowledgement is not proof of completion; read canonical status. Application access remains suspended regardless of provider outcome.
      tags: [Access]
      parameters:
        - in: path
          name: workspaceMembershipId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          description: Attempt processed or already claimed/completed; read status separately.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [checked] }
        '400':
          description: Invalid identifier.
        '401':
          description: No verified identity.
        '403':
          description: Uniform denial for missing authority or an active, unknown or foreign target.
  /api/workspace-membership-suspensions:
    post:
      operationId: suspendWorkspaceMembership
      summary: Suspend one active Workspace Membership without deleting identity or history
      tags:
        - Access
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspendWorkspaceMembershipInput'
      responses:
        '201':
          description: The canonical inactive Workspace Membership result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMembershipSuspension'
        '400':
          description: The Membership identifier is malformed, the idempotency key is missing, or the key was used for another target.
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks live access-administration authority, the target is not active in the current Workspace, or suspension would remove its last active authority holder.
  /api/company-context-assignments:
    post:
      operationId: grantCompanyContextAssignment
      summary: Grant the fixed Company Context Access bundle to an active Workspace Membership
      tags:
        - Access
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantCompanyContextAssignmentInput'
      responses:
        '201':
          description: The active canonical Company Context Access assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyContextAssignment'
        '400':
          description: A membership or Company identifier is malformed.
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks assignment authority or a target is not active in the current Workspace.
  /api/company-context-assignments/{workspaceMembershipId}/{companyId}:
    delete:
      operationId: revokeCompanyContextAssignment
      summary: Revoke the fixed Company Context Access assignment
      tags:
        - Access
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: workspaceMembershipId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: companyId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The revoked canonical assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyContextAssignment'
        '400':
          description: A membership or Company identifier is malformed.
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks assignment authority or the assignment is outside the current Workspace.
  /api/company-director-client-assignments:
    post:
      operationId: grantCompanyDirectorClientAssignment
      summary: Grant the fixed Company Director Client Access bundle to an active Workspace Membership
      tags:
        - Access
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantCompanyContextAssignmentInput'
      responses:
        '201':
          description: The active canonical Company Director Client Access assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDirectorClientAssignment'
        '400':
          description: A target or idempotent command is invalid.
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks assignment authority or a target is not active in the current Workspace.
  /api/company-director-client-assignments/{workspaceMembershipId}/{companyId}:
    delete:
      operationId: revokeCompanyDirectorClientAssignment
      summary: Revoke the fixed Company Director Client Access assignment
      tags:
        - Access
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: workspaceMembershipId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: companyId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The revoked canonical Company Director Client Access assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDirectorClientAssignment'
        '400':
          description: A target or idempotent command is invalid.
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks assignment authority or the assignment is outside the current Workspace.
  /api/company-document-approver-assignments:
    post:
      operationId: grantCompanyDocumentApproverAssignment
      summary: Grant the opt-in Company Document Approver v1 bundle to an active Workspace Membership
      description: >-
        Requires `company.assignment.manage`. The captured v1 bundle contains
        exactly `document.version.designate_official`; it confers no Company
        context, Document or Representation read, Client read, correction or
        Version management. An actual grant records one
        `company_document_approver_assignment.granted` event whose metadata
        is limited to the bundle label; a repeat, replay or denial records
        none.
      tags:
        - Access
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantCompanyContextAssignmentInput'
      responses:
        '201':
          description: The active canonical Company Document Approver assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDocumentApproverAssignment'
        '400':
          description: A target or idempotent command is invalid.
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks assignment authority or a target is not active in the current Workspace.
  /api/company-document-approver-assignments/{workspaceMembershipId}/{companyId}:
    delete:
      operationId: revokeCompanyDocumentApproverAssignment
      summary: Revoke the Company Document Approver assignment
      description: >-
        An actual revocation records one
        `company_document_approver_assignment.revoked` event whose metadata is
        limited to the bundle label; a repeat, replay or denial records none.
      tags:
        - Access
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: workspaceMembershipId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: companyId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The revoked canonical Company Document Approver assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDocumentApproverAssignment'
        '400':
          description: A target or idempotent command is invalid.
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks assignment authority or the assignment is outside the current Workspace.
  /api/clients:
    get:
      operationId: listActiveCompanyClients
      summary: List minimal shared Clients related to the active Company
      tags:
        - Client
      parameters:
        - $ref: '#/components/parameters/RequiredCompanyContextId'
      responses:
        '200':
          description: Active Client identities related to the active Company.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientAccountView'
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks Client authority or a valid active Company context.
    post:
      operationId: registerClientForActiveCompany
      summary: Register a shared Client dossier and establish its active Company relationship
      tags:
        - Client
      parameters:
        - $ref: '#/components/parameters/RequiredCompanyContextId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: >-
          Callers with legacy Workspace `client.manage` authority must use the
          minimal request. Callers with active-Company `client.create`
          authority may use the enriched dossier request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterClientInput'
      responses:
        '201':
          description: The new Client identity related to the active Company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientAccountView'
        '400':
          description: The display name or idempotency key is invalid, or the key was used for another command.
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks Client authority or a valid active Company context.
        '409':
          description: An exact normalized identifier collision blocked the registration without creating a Client, relationship or success event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PossibleDuplicateReviewConflict'
  /api/clients/search:
    get:
      operationId: searchWorkspaceClients
      summary: Search the Workspace minimal shared Client identity
      tags:
        - Client
      parameters:
        - $ref: '#/components/parameters/RequiredCompanyContextId'
        - in: query
          name: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        '200':
          description: At most 20 matching Client identities and their active-Company relationship state.
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items:
                  $ref: '#/components/schemas/ClientAccountView'
        '400':
          description: The search query is blank, missing or too long.
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks Client authority or a valid active Company context.
  /api/clients/{clientAccountId}:
    get:
      operationId: getActiveCompanyClientDossier
      summary: Read the approved shared Client dossier through an active Company relationship
      tags:
        - Client
      parameters:
        - $ref: '#/components/parameters/RequiredCompanyContextId'
        - in: path
          name: clientAccountId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Shared general fields and involved provider Company display names only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientDossierView'
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks Client read authority or a valid active Company context.
        '404':
          description: No active Client related to the active Company is visible.
    patch:
      operationId: correctActiveCompanyClientDossier
      summary: Correct shared Client fields using optimistic concurrency
      tags:
        - Client
      parameters:
        - $ref: '#/components/parameters/RequiredCompanyContextId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: clientAccountId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectClientInput'
      responses:
        '200':
          description: The corrected Client dossier with its incremented version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientDossierView'
        '400':
          description: The correction, expected version or idempotent intent is invalid.
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks Client update authority or a valid active Company context.
        '404':
          description: No active Client related to the active Company is visible.
        '409':
          description: The expected Client version is stale, or an exact normalized identifier collision blocked the correction without changing the dossier or success history.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PossibleDuplicateReviewConflict'
                  - $ref: '#/components/schemas/GenericConflict'
  /api/clients/{clientAccountId}/correction-history:
    get:
      operationId: listActiveCompanyClientCorrectionHistory
      summary: Read one Client's correction history recorded in the active Company
      description: >-
        Authorization and every refusal are identical to the dossier read. Only
        this Client's `client.corrected` events recorded in the server-validated
        active Company are returned, newest first by server time and then id.
        Each page holds at most 20 corrections; older corrections load only with
        the returned cursor. The read changes nothing and records no Activity
        event.
      tags:
        - Client
      parameters:
        - $ref: '#/components/parameters/RequiredCompanyContextId'
        - in: path
          name: clientAccountId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: cursor
          required: false
          description: The `nextCursor` returned by the previous page.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: One page of corrections with exactly the stored previous and new values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientCorrectionHistoryPage'
        '400':
          description: The Client id is malformed, or the cursor is malformed, unknown or not a visible correction of this Client in the active Company.
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks Client read authority or a valid active Company context.
        '404':
          description: No active Client related to the active Company is visible.
        '500':
          description: Stored correction history does not match the typed change shape; no partial history is returned.
  /api/clients/{clientAccountId}/legal-entities:
    get:
      operationId: listActiveCompanyClientLegalEntities
      summary: Read the additional Client Legal Entities of a visible shared dossier
      description: >-
        Authorization and every refusal are identical to the dossier read. The
        visibility check and the list share one consistent read. At most 50
        entities are returned in creation order, then id. The read changes
        nothing and records no Activity event.
      tags:
        - Client
      parameters:
        - $ref: '#/components/parameters/RequiredCompanyContextId'
        - in: path
          name: clientAccountId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The current Client version and its additional legal entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientLegalEntityList'
        '400':
          description: The Client id is malformed.
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks Client read authority or a valid active Company context.
        '404':
          description: No active Client related to the active Company is visible.
    post:
      operationId: registerClientLegalEntity
      summary: Record one additional Client Legal Entity or branch under the dossier version token
      description: >-
        Requires exactly the dossier correction authority. The Client row is
        locked as a correction locks it; the expected version must be current
        and advances by one together with the entity, a durable receipt and one
        `client_legal_entity.registered` event. An exact replay of the key
        returns the stored result after revalidating current authority. The
        entity identifier takes part in no duplicate detection, reservation,
        uniqueness rule or search.
      tags:
        - Client
      parameters:
        - $ref: '#/components/parameters/RequiredCompanyContextId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: clientAccountId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterClientLegalEntityInput'
      responses:
        '201':
          description: The recorded entity and the incremented Client version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientLegalEntityMutationResult'
        '400':
          description: The request, expected version or key is invalid, or the key was used for another Client command.
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks Client update authority or a valid active Company context.
        '404':
          description: No active Client related to the active Company is visible.
        '409':
          description: >-
            The expected Client version is stale (`The Client dossier has
            changed.`), or the Client already records 50 additional entities.
            Nothing is written.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ClientLegalEntityCapacityConflict'
                  - $ref: '#/components/schemas/GenericConflict'
  /api/clients/{clientAccountId}/legal-entities/{legalEntityId}:
    patch:
      operationId: correctClientLegalEntity
      summary: Correct one additional Client Legal Entity under the dossier version token
      description: >-
        Requires exactly the dossier correction authority and follows the
        registration's lock, version, receipt and replay rules. A material
        correction records one `client_legal_entity.corrected` event with the
        previous and new values; a correction that changes nothing is refused.
      tags:
        - Client
      parameters:
        - $ref: '#/components/parameters/RequiredCompanyContextId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: clientAccountId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: legalEntityId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectClientLegalEntityInput'
      responses:
        '200':
          description: The corrected entity and the incremented Client version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientLegalEntityMutationResult'
        '400':
          description: The request, expected version or key is invalid, the key was used for another Client command, or the correction changes no field.
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks Client update authority or a valid active Company context.
        '404':
          description: No active Client related to the active Company is visible, or the entity does not belong to that Client.
        '409':
          description: The expected Client version is stale (`The Client dossier has changed.`). Nothing is written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericConflict'
  /api/client-duplicate-reviews:
    get:
      operationId: listAuthorizedClientDuplicateReviews
      summary: List opaque pending duplicate reviews covered by complete current v2 authority
      tags:
        - Client
      parameters:
        - $ref: '#/components/parameters/RequiredCompanyContextId'
        - in: query
          name: page_size
          required: false
          description: Maximum number of durable reviews revalidated in this page.
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 20
        - in: query
          name: cursor
          required: false
          description: Server-owned opaque continuation cursor from the preceding page.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A stable page of only currently authorized, non-stale references for the active attempted Company. A page can have no visible items and still provide a continuation cursor when its bounded durable window contained only stale or unauthorized reviews.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientDuplicateReviewPage'
        '400':
          description: The page size or opaque cursor is malformed, unknown or outside the active Company scope.
        '401':
          description: No verified External Principal is available.
        '403':
          description: The selected Company context is invalid.
  /api/client-duplicate-reviews/{duplicateReviewReference}:
    get:
      operationId: readAuthorizedClientDuplicateReview
      summary: Compare one rejected proposal or return remediation-only after complete current v2 authority
      tags:
        - Client
      parameters:
        - $ref: '#/components/parameters/RequiredCompanyContextId'
        - in: path
          name: duplicateReviewReference
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: One exact candidate comparison, or the bounded remediation-only outcome for multiple candidates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientDuplicateReviewDetail'
        '400':
          description: The opaque reference is malformed.
        '401':
          description: No verified External Principal is available.
        '403':
          description: The selected Company context is invalid.
        '404':
          description: The reference is absent, stale, unavailable or not covered by complete current authority.
