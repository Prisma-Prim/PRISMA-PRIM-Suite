        - from
        - to
        - occurredAt
        - actor
      description: >-
        Discriminated by `action`: `activate` adds `withStartException`,
        `hold` and `cancel` add `reason`, `complete` adds `note`.
      properties:
        action:
          type: string
          enum:
            - activate
            - hold
            - resume
            - complete
            - cancel
        lifecycleRevision:
          type: integer
          minimum: 1
        from:
          $ref: '#/components/schemas/ProjectStatus'
        to:
          $ref: '#/components/schemas/ProjectStatus'
        occurredAt:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/ProjectLifecycleActor'
        withStartException:
          type: boolean
        reason:
          $ref: '#/components/schemas/ProjectReason'
        note:
          $ref: '#/components/schemas/ProjectReason'
    ProjectLifecycle:
      type: object
      additionalProperties: false
      required:
        - status
        - lifecycleRevision
        - mutable
        - start
        - transitions
      properties:
        status:
          $ref: '#/components/schemas/ProjectStatus'
        lifecycleRevision:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: The lifecycle version token; 0 until the first transition.
        mutable:
          type: boolean
          description: True only while the Project is open and its original Client is active and actively related to the Company.
        start:
          description: Null before activation.
          oneOf:
            - $ref: '#/components/schemas/ProjectStart'
            - type: 'null'
        transitions:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ProjectLifecycleTransition'
    ProjectLifecycleTransitionCommand:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - action
            - expectedLifecycleRevision
            - declaration
          description: A `startException` is required when any item is missing and forbidden otherwise.
          properties:
            action:
              type: string
              const: activate
            expectedLifecycleRevision:
              $ref: '#/components/schemas/ProjectLifecycleRevision'
            declaration:
              $ref: '#/components/schemas/ProjectStartDeclaration'
            startException:
              type: object
              additionalProperties: false
              required:
                - reason
                - completionMembershipId
                - completionDueDate
              properties:
                reason:
                  $ref: '#/components/schemas/ProjectReason'
                completionMembershipId:
                  type: string
                  format: uuid
                completionDueDate:
                  type: string
                  format: date
                  description: An exact YYYY-MM-DD date, years 0001–9999; past dates are allowed.
        - type: object
          additionalProperties: false
          required:
            - action
            - expectedLifecycleRevision
            - reason
          properties:
            action:
              type: string
              const: hold
            expectedLifecycleRevision:
              $ref: '#/components/schemas/ProjectLifecycleRevision'
            reason:
              $ref: '#/components/schemas/ProjectReason'
        - type: object
          additionalProperties: false
          required:
            - action
            - expectedLifecycleRevision
            - note
          properties:
            action:
              type: string
              const: complete
            expectedLifecycleRevision:
              $ref: '#/components/schemas/ProjectLifecycleRevision'
            note:
              $ref: '#/components/schemas/ProjectReason'
        - type: object
          additionalProperties: false
          required:
            - action
            - expectedLifecycleRevision
            - reason
          properties:
            action:
              type: string
              const: cancel
            expectedLifecycleRevision:
              $ref: '#/components/schemas/ProjectLifecycleRevision'
            reason:
              $ref: '#/components/schemas/ProjectReason'
        - type: object
          additionalProperties: false
          required:
            - action
            - expectedLifecycleRevision
          properties:
            action:
              type: string
              const: resume
            expectedLifecycleRevision:
              $ref: '#/components/schemas/ProjectLifecycleRevision'
    ProjectLifecycleRevision:
      type: integer
      minimum: 0
      maximum: 2147483647
    ProjectLifecycleReceipt:
      type: object
      additionalProperties: false
      required:
