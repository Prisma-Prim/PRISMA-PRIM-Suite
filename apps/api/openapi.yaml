openapi: 3.1.0
info:
  title: PRISMA-PRIM Suite API
  version: 0.1.0
paths:
  /api/access/current-actor:
    get:
      operationId: getCurrentActor
      summary: Resolve the verified external identity to the current Internal User
      tags:
        - Access
      parameters:
        - $ref: '#/components/parameters/CompanyContextId'
      responses:
        '200':
          description: The active local actor and persistent Workspace context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorContext'
        '401':
          description: No verified External Principal is available.
        '403':
          description: The principal has no active authority or the requested Company context is invalid.
  /api/activity-log:
    get:
      operationId: listCurrentWorkspaceActivity
      summary: List visible Activity Log events for the current Workspace
      tags:
        - Accountability
      parameters:
        - $ref: '#/components/parameters/CompanyContextId'
      responses:
        '200':
          description: A bounded reverse-chronological Activity Log page.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - events
                properties:
                  events:
                    type: array
                    maxItems: 50
                    items:
                      $ref: '#/components/schemas/ActivityLogEvent'
        '401':
          description: No verified External Principal is available.
        '403':
          description: The principal has no active authority or the requested Company context is invalid.
  /api/companies:
    get:
      operationId: listVisibleCompanies
      summary: List active Companies visible to the actor in the current Workspace
      tags:
        - Company
      parameters:
        - $ref: '#/components/parameters/CompanyContextId'
      responses:
        '200':
          description: Active visible Companies ordered by display name and identifier.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompanyRecord'
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks Company visibility or the requested Company context is invalid.
    post:
      operationId: registerCompany
      summary: Register one provider Company in the actor's Workspace
      tags:
        - Company
      parameters:
        - $ref: '#/components/parameters/CompanyContextId'
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCompanyInput'
      responses:
        '201':
          description: The registered active provider Company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyRecord'
        '400':
          description: The Company display name or idempotency key is blank or missing, or the idempotency key was already used for a different registration command.
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks Company administration or the requested Company context is invalid.
  /api/companies/{companyId}:
    get:
      operationId: getCompany
      summary: Read one provider Company in the actor's Workspace
      tags:
        - Company
      parameters:
        - $ref: '#/components/parameters/CompanyContextId'
        - in: path
          name: companyId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The Workspace-owned provider Company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyRecord'
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks Company visibility or the requested Company context is invalid.
        '404':
          description: No visible Company matches the identifier in the actor's Workspace.
  /api/company-context-assignments:
    post:
      operationId: grantCompanyContextAssignment
      summary: Grant the fixed Company Context Access bundle to an active Workspace Membership
      tags:
        - Access
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantCompanyContextAssignmentInput'
      responses:
        '201':
          description: The active canonical Company Context Access assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyContextAssignment'
        '400':
          description: A membership or Company identifier is malformed.
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks assignment authority or a target is not active in the current Workspace.
  /api/company-context-assignments/{workspaceMembershipId}/{companyId}:
    delete:
      operationId: revokeCompanyContextAssignment
      summary: Revoke the fixed Company Context Access assignment
      tags:
        - Access
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: workspaceMembershipId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: companyId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The revoked canonical assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyContextAssignment'
        '400':
          description: A membership or Company identifier is malformed.
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks assignment authority or the assignment is outside the current Workspace.
  /api/company-director-client-assignments:
    post:
      operationId: grantCompanyDirectorClientAssignment
      summary: Grant the fixed Company Director Client Access bundle to an active Workspace Membership
      tags:
        - Access
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantCompanyContextAssignmentInput'
      responses:
        '201':
          description: The active canonical Company Director Client Access assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDirectorClientAssignment'
        '400':
          description: A target or idempotent command is invalid.
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks assignment authority or a target is not active in the current Workspace.
  /api/company-director-client-assignments/{workspaceMembershipId}/{companyId}:
    delete:
      operationId: revokeCompanyDirectorClientAssignment
      summary: Revoke the fixed Company Director Client Access assignment
      tags:
        - Access
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: workspaceMembershipId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: companyId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The revoked canonical Company Director Client Access assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDirectorClientAssignment'
        '400':
          description: A target or idempotent command is invalid.
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks assignment authority or the assignment is outside the current Workspace.
  /api/clients:
    get:
      operationId: listActiveCompanyClients
      summary: List minimal shared Clients related to the active Company
      tags:
        - Client
      parameters:
        - $ref: '#/components/parameters/RequiredCompanyContextId'
      responses:
        '200':
          description: Active Client identities related to the active Company.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientAccountView'
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks Client authority or a valid active Company context.
    post:
      operationId: registerClientForActiveCompany
      summary: Register a shared Client dossier and establish its active Company relationship
      tags:
        - Client
      parameters:
        - $ref: '#/components/parameters/RequiredCompanyContextId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterClientInput'
      responses:
        '201':
          description: The new Client identity related to the active Company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientAccountView'
        '400':
          description: The display name or idempotency key is invalid, or the key was used for another command.
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks Client authority or a valid active Company context.
  /api/clients/search:
    get:
      operationId: searchWorkspaceClients
      summary: Search the Workspace minimal shared Client identity
      tags:
        - Client
      parameters:
        - $ref: '#/components/parameters/RequiredCompanyContextId'
        - in: query
          name: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        '200':
          description: At most 20 matching Client identities and their active-Company relationship state.
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items:
                  $ref: '#/components/schemas/ClientAccountView'
        '400':
          description: The search query is blank, missing or too long.
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks Client authority or a valid active Company context.
  /api/clients/{clientAccountId}:
    get:
      operationId: getActiveCompanyClientDossier
      summary: Read the approved shared Client dossier through an active Company relationship
      tags:
        - Client
      parameters:
        - $ref: '#/components/parameters/RequiredCompanyContextId'
        - in: path
          name: clientAccountId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Shared general fields and involved provider Company display names only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientDossierView'
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks Client read authority or a valid active Company context.
        '404':
          description: No active Client related to the active Company is visible.
    patch:
      operationId: correctActiveCompanyClientDossier
      summary: Correct shared Client fields using optimistic concurrency
      tags:
        - Client
      parameters:
        - $ref: '#/components/parameters/RequiredCompanyContextId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: clientAccountId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectClientInput'
      responses:
        '200':
          description: The corrected Client dossier with its incremented version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientDossierView'
        '400':
          description: The correction, expected version or idempotent intent is invalid.
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks Client update authority or a valid active Company context.
        '404':
          description: No active Client related to the active Company is visible.
        '409':
          description: The expected Client version is stale.
  /api/clients/{clientAccountId}/active-company-relationship:
    put:
      operationId: attachClientToActiveCompany
      summary: Establish the active Company's relationship to an existing shared Client
      tags:
        - Client
      parameters:
        - $ref: '#/components/parameters/RequiredCompanyContextId'
        - in: path
          name: clientAccountId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The existing Client identity related to the active Company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientAccountView'
        '400':
          description: The Client identifier is malformed.
        '401':
          description: No verified External Principal is available.
        '403':
          description: The actor lacks Client authority or a valid active Company context.
        '404':
          description: No active Client matches the identifier in the actor's Workspace.
components:
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: A caller-scoped command key whose replay returns the original command result.
      schema:
        type: string
        minLength: 1
    CompanyContextId:
      in: header
      name: X-Company-Context-Id
      required: false
      description: A Company selection hint revalidated by Access on this protected request.
      schema:
        type: string
    RequiredCompanyContextId:
      in: header
      name: X-Company-Context-Id
      required: true
      description: The active Company selection revalidated by Access for this Client operation.
      schema:
        type: string
  schemas:
    ActivityLogEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - action
        - occurredAt
        - actor
        - target
        - metadata
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
          enum:
            - internal_user.provisioned
            - company.registered
            - company_context_assignment.granted
            - company_context_assignment.revoked
            - company_director_client_assignment.granted
            - company_director_client_assignment.revoked
            - client.created
            - client_company_relationship.established
            - client.corrected
        occurredAt:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/ActivityLogInternalUserReference'
        target:
          oneOf:
            - $ref: '#/components/schemas/ActivityLogInternalUserTargetReference'
            - $ref: '#/components/schemas/ActivityLogCompanyTargetReference'
            - $ref: '#/components/schemas/ActivityLogCompanyRoleAssignmentTargetReference'
            - $ref: '#/components/schemas/ActivityLogClientTargetReference'
            - $ref: '#/components/schemas/ActivityLogClientCompanyRelationshipTargetReference'
        metadata:
          oneOf:
            - $ref: '#/components/schemas/IdentityProvisionedMetadata'
            - $ref: '#/components/schemas/CompanyRegisteredMetadata'
            - $ref: '#/components/schemas/CompanyContextAssignmentMetadata'
            - $ref: '#/components/schemas/ClientCorrectedMetadata'
    ActivityLogInternalUserReference:
      type: object
      additionalProperties: false
      required:
        - internalUserId
        - displayName
      properties:
        internalUserId:
          type: string
          format: uuid
        displayName:
          type: string
    ActivityLogInternalUserTargetReference:
      type: object
      additionalProperties: false
      required:
        - type
        - internalUserId
        - displayName
      properties:
        type:
          type: string
          const: internal_user
        internalUserId:
          type: string
          format: uuid
        displayName:
          type: string
    ActivityLogCompanyTargetReference:
      type: object
      additionalProperties: false
      required:
        - type
        - companyId
        - displayName
      properties:
        type:
          type: string
          const: company
        companyId:
          type: string
          format: uuid
        displayName:
          type: string
    IdentityProvisionedMetadata:
      type: object
      additionalProperties: false
      required:
        - identityProvider
      properties:
        identityProvider:
          type: string
    CompanyRegisteredMetadata:
      type: object
      additionalProperties: false
    CompanyContextAssignmentMetadata:
      type: object
      additionalProperties: false
      required:
        - bundle
      properties:
        bundle:
          type: string
          enum:
            - Company Context Access
            - Company Director Client Access
    ClientCorrectedMetadata:
      type: object
      additionalProperties: false
      required:
        - changes
      properties:
        changes:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            displayName:
              $ref: '#/components/schemas/ClientCorrectionChange'
            taxId:
              $ref: '#/components/schemas/ClientCorrectionChange'
            address:
              $ref: '#/components/schemas/ClientCorrectionChange'
            telephone:
              $ref: '#/components/schemas/ClientCorrectionChange'
            generalEmail:
              $ref: '#/components/schemas/ClientCorrectionChange'
            contacts:
              $ref: '#/components/schemas/ClientCorrectionChange'
            businessActivity:
              $ref: '#/components/schemas/ClientCorrectionChange'
    ClientCorrectionChange:
      type: object
      additionalProperties: false
      required:
        - before
        - after
      properties:
        before: {}
        after: {}
    ActivityLogCompanyRoleAssignmentTargetReference:
      type: object
      additionalProperties: false
      required:
        - type
        - assignmentId
        - companyId
        - companyDisplayName
        - workspaceMembershipId
        - internalUserId
        - internalUserDisplayName
      properties:
        type:
          type: string
          const: company_role_assignment
        assignmentId:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        companyDisplayName:
          type: string
        workspaceMembershipId:
          type: string
          format: uuid
        internalUserId:
          type: string
          format: uuid
        internalUserDisplayName:
          type: string
    ActivityLogClientTargetReference:
      type: object
      additionalProperties: false
      required:
        - type
        - clientAccountId
        - displayName
      properties:
        type:
          type: string
          const: client_account
        clientAccountId:
          type: string
          format: uuid
        displayName:
          type: string
    ActivityLogClientCompanyRelationshipTargetReference:
      type: object
      additionalProperties: false
      required:
        - type
        - relationshipId
        - clientAccountId
        - clientDisplayName
        - companyId
        - companyDisplayName
      properties:
        type:
          type: string
          const: client_company_relationship
        relationshipId:
          type: string
          format: uuid
        clientAccountId:
          type: string
          format: uuid
        clientDisplayName:
          type: string
        companyId:
          type: string
          format: uuid
        companyDisplayName:
          type: string
    GrantCompanyContextAssignmentInput:
      type: object
      additionalProperties: false
      required:
        - workspaceMembershipId
        - companyId
      properties:
        workspaceMembershipId:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
    CompanyContextAssignment:
      type: object
      additionalProperties: false
      required:
        - id
        - workspaceMembershipId
        - companyId
        - bundle
        - active
      properties:
        id:
          type: string
          format: uuid
        workspaceMembershipId:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        bundle:
          type: string
          const: Company Context Access
        active:
          type: boolean
    CompanyDirectorClientAssignment:
      type: object
      additionalProperties: false
      required:
        - id
        - workspaceMembershipId
        - companyId
        - bundle
        - active
      properties:
        id:
          type: string
          format: uuid
        workspaceMembershipId:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        bundle:
          type: string
          const: Company Director Client Access
        active:
          type: boolean
    RegisterCompanyInput:
      type: object
      additionalProperties: false
      required:
        - displayName
      properties:
        displayName:
          type: string
          minLength: 1
    CompanyRecord:
      type: object
      additionalProperties: false
      required:
        - id
        - workspaceId
        - displayName
        - status
        - createdAt
        - createdByInternalUserId
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        displayName:
          type: string
        status:
          type: string
          const: active
        createdAt:
          type: string
          format: date-time
        createdByInternalUserId:
          type: string
          format: uuid
    RegisterClientInput:
      type: object
      additionalProperties: false
      required:
        - displayName
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        taxId:
          type:
            - string
            - 'null'
          maxLength: 500
        address:
          type:
            - string
            - 'null'
          maxLength: 2000
        telephone:
          type:
            - string
            - 'null'
          maxLength: 500
        generalEmail:
          type:
            - string
            - 'null'
          format: email
          maxLength: 320
        contacts:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ClientContact'
        businessActivity:
          type:
            - string
            - 'null'
          maxLength: 2000
    CorrectClientInput:
      type: object
      additionalProperties: false
      minProperties: 2
      required:
        - expectedVersion
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        taxId:
          type:
            - string
            - 'null'
          maxLength: 500
        address:
          type:
            - string
            - 'null'
          maxLength: 2000
        telephone:
          type:
            - string
            - 'null'
          maxLength: 500
        generalEmail:
          type:
            - string
            - 'null'
          format: email
          maxLength: 320
        contacts:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ClientContact'
        businessActivity:
          type:
            - string
            - 'null'
          maxLength: 2000
    ClientContact:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 500
        telephone:
          type: string
          maxLength: 500
        email:
          type: string
          format: email
          maxLength: 320
    ClientAccountView:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
        - relatedToActiveCompany
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        relatedToActiveCompany:
          type: boolean
    ClientDossierView:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
        - relatedToActiveCompany
        - taxId
        - address
        - telephone
        - generalEmail
        - contacts
        - businessActivity
        - version
        - involvedCompanyDisplayNames
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        relatedToActiveCompany:
          type: boolean
          const: true
        taxId:
          type:
            - string
            - 'null'
        address:
          type:
            - string
            - 'null'
        telephone:
          type:
            - string
            - 'null'
        generalEmail:
          type:
            - string
            - 'null'
          format: email
        contacts:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ClientContact'
        businessActivity:
          type:
            - string
            - 'null'
        version:
          type: integer
          minimum: 1
        involvedCompanyDisplayNames:
          type: array
          uniqueItems: true
          items:
            type: string
    ActorContext:
      type: object
      additionalProperties: false
      required:
        - internalUserId
        - workspaceMembershipId
        - workspaceId
        - workspaceName
        - displayName
        - email
        - active
        - workspacePermissions
      properties:
        internalUserId:
          type: string
          format: uuid
        workspaceMembershipId:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        workspaceName:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
        active:
          type: boolean
          const: true
        workspacePermissions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - company.manage
              - company.assignment.manage
              - client.manage
        activeCompany:
          $ref: '#/components/schemas/ActiveCompanyContext'
    ActiveCompanyContext:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
        - clientPermissions
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        clientPermissions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - client.read
              - client.create
              - client.update
