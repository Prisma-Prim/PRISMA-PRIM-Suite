- form "Записать наблюдение этапа 2":
  - paragraph: Выберите классификацию, укажите требование, процесс или область и формулировку и сошлитесь на точные свидетельства, приложенные к этому делу. Несоответствие ссылается хотя бы на один PDF-свидетельство; возможность для улучшения может не указывать требование и область.
  - group "Классификация":
    - text: Классификация
    - radio "Значительное несоответствие" [checked]
    - text: Значительное несоответствие
    - radio "Незначительное несоответствие"
    - text: Незначительное несоответствие
    - radio "Возможность для улучшения"
    - text: Возможность для улучшения
  - text: Требование (пункт)
  - textbox "Требование (пункт)": 8.5.1
  - text: Например, 8.5.1. Необязательно только для возможности для улучшения. Процесс или область
  - textbox "Процесс или область": Recepția laptelui / Приёмка молока (fictiv)
  - text: Формулировка
  - textbox "Формулировка": "Exemplu fictiv: analiza pericolelor nu acoperă alergenii la recepție."
  - group "Свидетельства":
    - text: Свидетельства PDF, приложенные к этому делу с ролью «Свидетельство», не более десяти.
    - checkbox "Fictional receiving evidence — версия 1 (evidence.pdf)" [checked]
    - text: Fictional receiving evidence — версия 1 (evidence.pdf)
  - button "Записать наблюдение"
  - button "Отмена"