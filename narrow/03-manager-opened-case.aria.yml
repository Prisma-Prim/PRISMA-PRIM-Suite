  - region "Согласованность досье":
    - heading "Согласованность досье" [level=5]
    - paragraph: Проверка сравнивает значения, записанные в деле. Каждое расхождение показывает оба значения с их источником; человек устраняет его исправлением или принятием с указанием причины.
