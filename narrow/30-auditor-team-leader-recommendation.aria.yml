- form "Записать рекомендацию группы":
  - paragraph: "Руководитель утверждённой аудиторской группы рекомендует выдать сертификацию, не выдавать её или провести дополнительный аудит и указывает основание. Ничего не выбрано заранее. Дополнительный аудит не входит в этот процесс: при такой рекомендации в сертификации можно только отказать."
  - group "Рекомендация":
    - text: Рекомендация
    - radio "Выдать сертификацию" [checked]
    - text: Выдать сертификацию
    - radio "Не выдавать сертификацию"
    - text: Не выдавать сертификацию
    - radio "Нужен дополнительный аудит"
    - text: Нужен дополнительный аудит
  - text: Основание рекомендации
  - textbox "Основание рекомендации": "Exemplu fictiv: neconformitatea majoră a fost verificată ca eliminată."
  - text: Дата рекомендации
  - textbox "Дата рекомендации": 2026-11-17
  - button "Записать рекомендацию"