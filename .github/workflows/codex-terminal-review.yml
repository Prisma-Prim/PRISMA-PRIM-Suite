name: Codex terminal review

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number to re-evaluate after resolving review threads
        required: true
        type: number

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: >-
    codex-terminal-review-${{
      github.event.pull_request.number ||
      github.event.issue.number ||
      inputs.pull_request_number
    }}
  cancel-in-progress: true

jobs:
  codex-terminal-review:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Evaluate exact-head Codex review state
        uses: actions/github-script@v7
        with:
          script: |
            const path = await import('node:path');
            const { pathToFileURL } = await import('node:url');
            const evaluatorUrl = pathToFileURL(
              path.join(
                process.env.GITHUB_WORKSPACE,
                'scripts/validate-codex-review-gate.mjs',
              ),
            ).href;
            const { evaluateCodexReviewGate } = await import(evaluatorUrl);

            const pullRequestNumber =
              context.payload.pull_request?.number ??
              context.payload.issue?.number ??
              Number(context.payload.inputs?.pull_request_number);

            if (!Number.isInteger(pullRequestNumber)) {
              core.setFailed('A pull request number is required.');
              return;
            }

            const { owner, repo } = context.repo;
            const { data: pullRequest } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullRequestNumber,
            });
            const statusContext = 'Codex terminal review';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: pullRequest.head.sha,
              state: 'pending',
              context: statusContext,
              description: 'Re-evaluating the current-head Codex review state.',
              target_url: runUrl,
            });

            const [reviews, comments] = await Promise.all([
              github.paginate(github.rest.pulls.listReviews, {
                owner,
                repo,
                pull_number: pullRequestNumber,
                per_page: 100,
              }),
              github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: pullRequestNumber,
                per_page: 100,
              }),
            ]);

            const reviewThreads = [];
            let cursor = null;
            do {
              const data = await github.graphql(
                `query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      reviewThreads(first: 100, after: $cursor) {
                        nodes {
                          isResolved
                          isOutdated
                          comments(first: 1) {
                            nodes { author { login } }
                          }
                        }
                        pageInfo { hasNextPage endCursor }
                      }
                    }
                  }
                }`,
                { owner, repo, number: pullRequestNumber, cursor },
              );
              const page = data.repository.pullRequest.reviewThreads;
              reviewThreads.push(...page.nodes);
              cursor = page.pageInfo.hasNextPage ? page.pageInfo.endCursor : null;
            } while (cursor);

            const codexLogin = 'chatgpt-codex-connector[bot]';
            const result = evaluateCodexReviewGate({
              headSha: pullRequest.head.sha,
              codexReviews: reviews
                .filter((review) => review.user?.login === codexLogin)
                .map((review) => ({
                  commitId: review.commit_id,
                  state: review.state,
                })),
              codexComments: comments
                .filter((comment) => comment.user?.login === codexLogin)
                .map((comment) => ({ body: comment.body })),
              codexThreads: reviewThreads
                .filter(
                  (thread) =>
                    thread.comments.nodes[0]?.author?.login === codexLogin,
                )
                .map((thread) => ({
                  isResolved: thread.isResolved,
                  isOutdated: thread.isOutdated,
                })),
            });

            await core.summary
              .addHeading('Codex terminal review')
              .addRaw(result.summary)
              .addEOL()
              .addRaw(`Evaluated PR head ${pullRequest.head.sha}.`)
              .write();

            const statusState = {
              pending: 'pending',
              blocked: 'failure',
              ready: 'success',
            }[result.state];
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: pullRequest.head.sha,
              state: statusState,
              context: statusContext,
              description: result.summary,
              target_url: runUrl,
            });

            if (result.state === 'ready') {
              core.notice(result.summary);
            } else {
              core.warning(result.summary);
            }
