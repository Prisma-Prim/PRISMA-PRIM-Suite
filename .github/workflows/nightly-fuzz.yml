name: Nightly fuzz

# Seeded model-based fuzzing of Company isolation, access revocation and
# Activity Log invariants through the real API on PostgreSQL: Internal
# Company Tasks (#1156), manual external Invoice Records (#1211), manual
# incoming Payment observations (#1218) and Documents and official Versions
# (#1241). It runs on main every night with a
# random seed and never gates a pull request; the regular API CI runs the
# same test files as fixed-seed smokes. Each fuzzed file is one matrix job
# with its own budget, so a module added here never shortens another's
# night. `report` keeps one open `fuzz-found` issue, which the owner closes
# after triage.
# Scheduled in the owner's Paris night, off the hour GitHub loads most (#1207).
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

# No workflow concurrency: nothing cancels a run and hides its failure.

jobs:
  fuzz:
    name: fuzz (${{ matrix.module }})
    strategy:
      # One module's failure never cancels another module's night.
      fail-fast: false
      matrix:
        include:
          - module: internal-task
            test: src/internal-task/internal-task.fuzz.rest.test.ts
          - module: invoice-record
            test: src/invoice-record/invoice-record.fuzz.rest.test.ts
          - module: payment
            test: src/payment/payment.fuzz.rest.test.ts
          - module: documents
            test: src/documents/documents.fuzz.rest.test.ts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://prisma_prim:prisma_prim@127.0.0.1:5432/prisma_prim_dev
      TEST_DATABASE_URL: postgresql://prisma_prim:prisma_prim@127.0.0.1:5432/prisma_prim_test
      POSTGRES_ADMIN_URL: postgresql://prisma_prim:prisma_prim@127.0.0.1:5432/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up repository verification
        uses: ./.github/actions/setup-verification
        with:
          chromium: 'false'

      - name: Verify supported agent environment
        run: pnpm agent:doctor:postgres

      # The test logs its random seed. Every module gets the same size: 800
      # runs or its own 20-minute limit, whichever comes first, ending a slow
      # night cleanly before the job timeout as a pass of the runs done.
      # Measured per run: Internal Company Tasks 0.8 to 1.3 seconds, Invoice
      # Records 0.9 seconds, Payments 0.8 seconds (#1200, #1211, #1218) and
      # Documents 1.3 seconds locally (#1241), so all usually finish.
      - name: Fuzz the API invariants
        env:
          FUZZ_SEED: random
          FUZZ_RUNS: '800'
          FUZZ_STEPS: '40'
          FUZZ_REPORT: ${{ runner.temp }}/fuzz-report.json
          FUZZ_TEST_FILE: ${{ matrix.test }}
        run: pnpm --filter @prisma-prim/api exec vitest run "$FUZZ_TEST_FILE"

      - name: Upload the failure report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-fuzz-report-${{ matrix.module }}
          path: ${{ runner.temp }}/fuzz-report.json
          if-no-files-found: ignore

  report:
    needs: fuzz
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    # One report at a time, so two failing nights never open two issues.
    concurrency:
      group: fuzz-found-report
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      # Each failing module's report lands in its own artifact directory.
      - name: Download the failure reports
        if: ${{ needs.fuzz.result == 'failure' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: nightly-fuzz-report-*
          path: ${{ runner.temp }}/fuzz-reports

      - name: Open, update or comment on the fuzz-found issue
        env:
          GH_TOKEN: ${{ github.token }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
          FUZZ_REPORTS: ${{ runner.temp }}/fuzz-reports
        run: node scripts/nightly-fuzz-report.mjs
