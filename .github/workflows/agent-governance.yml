name: Agent governance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-description:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Test governance validators
        run: node --test scripts/validate-pr-description.test.mjs

      - name: Review pull request description (advisory)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/validate-pr-description.mjs --advisory
