name: Agent metadata

on:
  push:
    branches:
      - main
    paths:
      - .github/ISSUE_TEMPLATE/agent-friction.yml
      - .github/workflows/agent-metadata.yml
  workflow_dispatch:

permissions:
  issues: write

jobs:
  ensure-agent-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Create or normalize agent labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ensure_label() {
            local name="$1"
            local color="$2"
            local description="$3"
            if gh api "repos/${GITHUB_REPOSITORY}/labels/${name}" >/dev/null 2>&1; then
              gh api \
                --method PATCH \
                "repos/${GITHUB_REPOSITORY}/labels/${name}" \
                -f new_name="${name}" \
                -f color="${color}" \
                -f description="${description}"
            else
              gh api \
                --method POST \
                "repos/${GITHUB_REPOSITORY}/labels" \
                -f name="${name}" \
                -f color="${color}" \
                -f description="${description}"
            fi
          }

          ensure_label \
            'agent-friction' \
            'BFD4F2' \
            'Repeatable repository, environment, CI, or AI harness friction'
