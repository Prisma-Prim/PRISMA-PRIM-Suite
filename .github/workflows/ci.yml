name: Issue 213 temporary acceptance evidence extraction
run-name: Inspect retained acceptance failure from run 39843619279
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  extract_failure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Retrieve the existing synthetic failure archive
        uses: actions/download-artifact@v4
        with:
          name: browser-evidence-part-acceptance-1-39843619279
          run-id: 39843619279
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original-evidence
      - name: Select only the one failed case and record provenance
        env:
          ORIGINAL: ${{ runner.temp }}/original-evidence
          SELECTED: ${{ runner.temp }}/selected-evidence
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil

          original = Path(os.environ['ORIGINAL'])
          selected = Path(os.environ['SELECTED'])
          selected.mkdir()
          case = 'project-template.acceptanc-522a1-rojects-across-four-locales-operational-acceptance-desktop'
          matches = [p for p in original.rglob('error-context.md') if p.parent.name == case]
          if len(matches) != 1:
              raise RuntimeError(f'Expected one exact failed case, found {len(matches)}')
          entries = []
          for name in ('error-context.md', 'test-failed-1.png', 'trace.zip'):
              source = matches[0].parent / name
              data = source.read_bytes()
              shutil.copyfile(source, selected / name)
              entries.append({'path': str(source.relative_to(original)), 'name': name,
                              'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
          if sum(entry['bytes'] for entry in entries) > 28 * 1024 * 1024:
              raise RuntimeError('Selected failure evidence exceeds the bounded download budget')
          manifest = {'source_run': 39843619279, 'source_artifact': 12454727408,
                      'source_artifact_sha256': '73122b44e34b15bc55cadf8c2f58010165591091c93a9ad750c1d95fd30bee2c',
                      'tested_source': '280560d1389d70d3027b1933b12d792f21e1661f',
                      'purpose': 'Read-only diagnostic extraction; no tests rerun and no pass claim',
                      'entries': entries}
          (selected / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest, indent=2))
          PY
      - name: Retain the selected unchanged failure evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue-213-selected-acceptance-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/selected-evidence/
          if-no-files-found: error
          retention-days: 14
