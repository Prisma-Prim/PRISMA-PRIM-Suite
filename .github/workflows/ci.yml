name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      mode:
        description: Run the narrow preflight or the full authoritative suite.
        required: false
        default: full
        type: string

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: prisma_prim_dev
          POSTGRES_USER: prisma_prim
          POSTGRES_PASSWORD: prisma_prim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma_prim -d prisma_prim_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://prisma_prim:prisma_prim@127.0.0.1:5432/prisma_prim_dev
      TEST_DATABASE_URL: postgresql://prisma_prim:prisma_prim@127.0.0.1:5432/prisma_prim_test
      POSTGRES_ADMIN_URL: postgresql://prisma_prim:prisma_prim@127.0.0.1:5432/postgres

    steps:
      - name: Validate requested verification mode
        if: ${{ inputs.mode != '' && inputs.mode != 'full' && inputs.mode != 'preflight' }}
        run: exit 2

      - name: Check out exact requested head
        uses: actions/checkout@v4

      - name: Set up repository verification
        uses: ./.github/actions/setup-verification

      - name: Verify preflight prerequisites
        run: pnpm preflight:local --check-only

      - name: Run canonical PostgreSQL and migration preflight
        if: ${{ inputs.mode == 'preflight' }}
        run: pnpm test:preflight:postgres

      - name: Run canonical desktop and narrow Playwright preflight
        if: ${{ inputs.mode == 'preflight' }}
        run: pnpm test:preflight:playwright

      - name: Lint
        if: ${{ inputs.mode != 'preflight' }}
        run: pnpm lint

      - name: Type-check
        if: ${{ inputs.mode != 'preflight' }}
        run: pnpm typecheck

      - name: Test
        if: ${{ inputs.mode != 'preflight' }}
        run: pnpm test

      - name: Upload browser evidence
        if: ${{ always() && inputs.mode != 'preflight' && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-pr-${{ github.event.pull_request.number }}
          path: apps/web/test-results/**/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Build
        if: ${{ inputs.mode != 'preflight' }}
        run: pnpm build

      - name: Check formatting
        if: ${{ inputs.mode != 'preflight' }}
        run: pnpm format:check
