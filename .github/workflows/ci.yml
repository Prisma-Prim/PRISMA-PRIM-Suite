name: Issue 213 temporary Codex universal installer smoke
run-name: Issue 213 exact-source 4f235eb Codex universal installer
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue-213-universal-smoke
  cancel-in-progress: false
jobs:
  universal_installer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the exact implementation source
        uses: actions/checkout@v4
        with:
          ref: 4f235eb6e30694c15c481c50378091b87bab0954
          persist-credentials: false
      - name: Make room for the actual Codex image
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - name: Acquire and identify the actual target image
        run: |
          mkdir -p "$RUNNER_TEMP/issue-213-evidence"
          docker pull ghcr.io/openai/codex-universal:latest
          docker image inspect --format '{{json .RepoDigests}}' ghcr.io/openai/codex-universal:latest > "$RUNNER_TEMP/issue-213-evidence/image-digests.json"
          git rev-parse HEAD > "$RUNNER_TEMP/issue-213-evidence/source.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/issue-213-evidence/tree.txt"
      - name: Run real cold setup and cached resume in the target image
        run: |
          set -euo pipefail
          docker run --rm --name issue-213-universal-installer \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/source,readonly" \
            --env CI=true \
            --workdir /workspace/issue-213 \
            --entrypoint /bin/bash \
            ghcr.io/openai/codex-universal:latest -lc '
              set -euo pipefail
              cp -r /source/. .
              test "$(git rev-parse HEAD)" = 4f235eb6e30694c15c481c50378091b87bab0954
              date -u
              bash scripts/codex-cloud-setup.sh --profile postgres
              bash scripts/codex-cloud-maintenance.sh --profile postgres
              runuser -u postgres -- psql -X -v ON_ERROR_STOP=1 -d postgres -c "SELECT rolname, rolcanlogin, rolcreatedb, rolsuper, rolcreaterole, rolreplication, rolbypassrls FROM pg_roles WHERE rolname = '\''prisma_prim'\''"
              runuser -u postgres -- psql -X -v ON_ERROR_STOP=1 -d postgres -c "SELECT datname, pg_get_userbyid(datdba) AS owner FROM pg_database WHERE datname IN ('\''prisma_prim_dev'\'', '\''prisma_prim_test'\'') ORDER BY datname"
              git diff --exit-code
              date -u
            ' 2>&1 | tee "$RUNNER_TEMP/issue-213-evidence/smoke.log"
      - name: Retain actual smoke evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-213-universal-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/issue-213-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove only the owned test container
        if: always()
        run: |
          if docker container inspect issue-213-universal-installer >/dev/null 2>&1; then
            docker rm -f issue-213-universal-installer
          fi
