name: Temporary canonical qualification PR1038

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: canonical-pr-1038-05fde93
  cancel-in-progress: false

jobs:
  canonical:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out the unchanged reviewed source
        uses: actions/checkout@v4
        with:
          ref: 05fde93f9ca4dcc7cd5c8850c2891ff4d28f0e88
          fetch-depth: 0

      - name: Bind the exact source and current base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = 05fde93f9ca4dcc7cd5c8850c2891ff4d28f0e88
          test "$(git rev-parse origin/main)" = 0780b032cc8ccee768e2481587ea3a38558215bc
          test "$(git rev-parse 'HEAD^{tree}')" = 307aff9b6253f1e67da36ad8710b0d2c0e81f389
          test -z "$(git status --porcelain)"

      - name: Prepare the normal pinned toolchain and Chromium
        uses: ./.github/actions/setup-verification
        with:
          postgres: "false"
          chromium: "true"

      - name: Preserve the installed Chromium path across managed PostgreSQL isolation
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"

      - name: Install the required frozen Railway dependencies
        run: pnpm --dir .railway install --frozen-lockfile

      - name: Acquire the normal pinned PostgreSQL image
        shell: bash
        env:
          POSTGRES_IMAGE_ARCHIVE: ${{ runner.temp }}/postgres-image/postgres.tar
        run: |
          set -euo pipefail
          bash scripts/ci-start-postgres.sh acquire
          test "$(docker image inspect prisma-prim-ci/postgres:17-pinned --format '{{.Id}}')" = sha256:79bd7c99e923138f136f8009d6bffa66e21e9d4fda5c0c561b00fc9c90cfe537
          docker tag prisma-prim-ci/postgres:17-pinned postgres:17-alpine

      - name: Prepare verified official packaging images without global overrides
        env:
          PACKAGING_IMAGE_DIRECTORY: ${{ runner.temp }}/packaging-images
        shell: bash
        run: |
          set -euo pipefail
          for image_attempt in 1 2 3; do
            if node scripts/ci-packaging-images.mjs acquire; then
              exit 0
            fi
            if [ "$image_attempt" -lt 3 ]; then
              echo "Verified image acquisition failed; waiting 15 seconds before the next bounded provisioning attempt."
              sleep 15
            fi
          done
          echo "Verified image provisioning failed; canonical tests will not start."
          exit 1

      - name: Record the hosted execution context
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          context = {
            'source': '05fde93f9ca4dcc7cd5c8850c2891ff4d28f0e88',
            'base': '0780b032cc8ccee768e2481587ea3a38558215bc',
            'tree': '307aff9b6253f1e67da36ad8710b0d2c0e81f389',
            'executionWorkflowCommit': os.environ['GITHUB_SHA'],
            'executionRun': os.environ['GITHUB_RUN_ID'],
            'dockerStorageDriver': subprocess.check_output(['docker', 'info', '--format', '{{.Driver}}'], text=True).strip(),
            'postgresProvisioning': 'Unchanged scripts/managed-postgres.mjs from the reviewed source; ordinary disposable named volume, no storage override.',
            'publicationBoundary': 'Fresh GitHub-hosted execution outputs from public source and synthetic fixtures only. No prior Codex workspace, local diagnostics, personal files or credentials are copied into this job.'
          }
          Path(os.environ['RUNNER_TEMP'], 'qualification-context.json').write_text(json.dumps(context, indent=2) + '\n')
          PY

      - name: Execute the unchanged complete canonical gate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/managed-postgres.mjs -- node scripts/verify-local.mjs run --source 05fde93f9ca4dcc7cd5c8850c2891ff4d28f0e88 --base origin/main --output "$RUNNER_TEMP/canonical-local-evidence"

      - name: Refresh the base and validate all original evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = 0780b032cc8ccee768e2481587ea3a38558215bc
          node scripts/verify-local.mjs validate --output "$RUNNER_TEMP/canonical-local-evidence"

      - name: Select exact original Invoice screenshots after canonical validation
        id: selected_invoice
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path, PurePosixPath

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          temporary = Path(os.environ['RUNNER_TEMP'])
          original = temporary / 'canonical-local-evidence'
          selected = temporary / 'selected-invoice-evidence'
          require(original.resolve(strict=True) == original and original.is_dir(), 'Original evidence root must be real.')
          require(not selected.exists() and not selected.is_symlink(), 'Selected output must be fresh.')

          def read_original(relative):
              path = PurePosixPath(relative)
              require(path.parts and not path.is_absolute() and '..' not in path.parts and
                      path.as_posix() == relative, 'Unsafe evidence path.')
              current = original
              for part in path.parts:
                  current = current / part
                  require(not current.is_symlink(), 'Evidence symlinks are refused.')
              require(current.is_file() and current.resolve().is_relative_to(original), 'Original evidence file missing.')
              return current.read_bytes()

          files = {name: read_original(name) for name in ('manifest.json', 'report.md')}
          context_path = temporary / 'qualification-context.json'
          require(context_path.is_file() and not context_path.is_symlink(), 'Execution context missing.')
          files['qualification-context.json'] = context_path.read_bytes()
          manifest = json.loads(files['manifest.json'])
          context = json.loads(files['qualification-context.json'])
          expected = {'source': '05fde93f9ca4dcc7cd5c8850c2891ff4d28f0e88', 'base': '0780b032cc8ccee768e2481587ea3a38558215bc', 'tree': '307aff9b6253f1e67da36ad8710b0d2c0e81f389'}
          require(manifest.get('schema') == 'prisma-prim-local-verification/v1' and
                  manifest.get('mode') == 'complete' and manifest.get('status') == 'passed' and
                  manifest.get('scope', {}).get('kind') == 'complete' and not manifest.get('refusal'),
                  'Original complete canonical evidence must have passed.')
          provenance = manifest.get('provenance', {})
          require([provenance.get(k) for k in ('sourceHead', 'baseHead', 'integrationTree')] == list(expected.values()),
                  'Original source/base/tree binding differs.')
          require(all(context.get(k) == v for k, v in expected.items()) and
                  context.get('executionWorkflowCommit') == os.environ['GITHUB_SHA'] and
                  context.get('executionRun') == os.environ['GITHUB_RUN_ID'], 'Hosted execution binding differs.')
          ids = 'doctor format lint types scripts documentation api-parallel api-serial web-unit browser acceptance acceptance-evidence build railway-types railway-tests packaging'.split()
          families = manifest.get('families', [])
          require([f.get('id') for f in families] == ids and all(
              f.get('required') is True and f.get('status') == 'passed' and
              f.get('executionOutcome') == {'kind': 'completed'} and
              type(f.get('exitCode')) is int and f['exitCode'] == 0 and
              f.get('signal') is None and f.get('reason') is None and
              f.get('startedAt') and f.get('finishedAt') for f in families), 'All 16 canonical families must be complete.')
          artifacts = manifest.get('artifacts', [])
          inventory = {a['path']: a['sha256'] for a in artifacts}
          require(len(inventory) == len(artifacts), 'Duplicate canonical artifact paths.')
          images = []
          for frame in ('prisme', 'classic'):
              for viewport in ('desktop', 'narrow'):
                  basename = f'invoice-record-record-{frame}-{viewport}-en-record.png'
                  paths = [relative for relative in inventory
                           if relative.startswith('browser-evidence/acceptance/') and PurePosixPath(relative).name == basename]
                  require(len(paths) == 1, 'Expected exactly one original Invoice screenshot: ' + basename)
                  relative = paths[0]
                  data = read_original(relative)
                  require(data[:8] == bytes([137, 80, 78, 71, 13, 10, 26, 10]) and sha(data) == inventory[relative],
                          'Original PNG magic/hash differs.')
                  files[relative] = data
                  images.append({'frame': frame, 'viewport': viewport, 'state': 'en-record',
                                 'original_relative_path': relative, 'published_path': relative,
                                 'bytes': len(data), 'sha256': sha(data)})
          index = {
              'schema': 'prisma-prim-selected-hosted-invoice-evidence/v1', **expected,
              'executionWorkflowCommit': context['executionWorkflowCommit'], 'executionRun': context['executionRun'],
              'canonical_manifest_sha256': sha(files['manifest.json']),
              'canonical_report_sha256': sha(files['report.md']),
              'qualification_context_sha256': sha(files['qualification-context.json']),
              'selected_images': images,
              'copied_files': [{'path': name, 'bytes': len(data), 'sha256': sha(data)} for name, data in sorted(files.items())],
              'canonical_artifact_count': len(artifacts), 'omitted_artifact_count': len(artifacts) - len(images),
              'omission_rule': 'All original inventory artifacts except the four listed PNGs are omitted from this selected packet. They remain in the original hosted evidence directory for the separate full artifact upload. No logs, traces or nested runtime inventories are copied here.',
              'scope': 'Selected original screenshots from this fresh hosted run only; NOT a standalone canonical-validation bundle. Original complete gate and canonical validate are separate preceding steps. Metadata and PNG bytes are unchanged. Root must inspect the downloaded images before claiming visual evidence. No prior CaaS evidence is read or copied.'
          }
          files['publication-index.json'] = (json.dumps(index, indent=2) + '\n').encode()
          size = sum(map(len, files.values()))
          require(len(images) == 4 and size < 100 * 1024 * 1024, 'Selected packet must contain four images and remain below 100 MiB.')
          selected.mkdir()
          for relative, data in files.items():
              destination = selected / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)
          print(json.dumps({'selected_image_count': len(images), 'packet_bytes': size,
                            'original_image_paths': [image['original_relative_path'] for image in images]}, indent=2))
          PY

      - name: Preserve the small selected original Invoice evidence
        if: ${{ always() && steps.selected_invoice.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: selected-invoice-pr-1038-05fde93
          path: ${{ runner.temp }}/selected-invoice-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Preserve complete fresh hosted-runner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-hosted-pr-1038-05fde93
          path: ${{ runner.temp }}/canonical-local-evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve the compact report and execution binding
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-hosted-pr-1038-05fde93-compact
          path: |
            ${{ runner.temp }}/canonical-local-evidence/manifest.json
            ${{ runner.temp }}/canonical-local-evidence/report.md
            ${{ runner.temp }}/qualification-context.json
          if-no-files-found: warn
          retention-days: 14
