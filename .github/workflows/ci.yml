name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for browser tests
        run: pnpm --filter @prisma-prim/web exec playwright install --with-deps chromium

      - name: Verify agent environment
        run: pnpm agent:doctor:web

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Upload browser evidence
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-pr-${{ github.event.pull_request.number }}
          path: apps/web/test-results/**/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Build
        run: pnpm build

      - name: Check formatting
        run: pnpm format:check
