name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  # Main health (main-health.yml) runs this complete CI nightly on main.
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  # The nightly main run gets a group of its own: nothing cancels it.
  group: ci-${{ github.event.pull_request.number || (github.event_name == 'schedule' && format('nightly-{0}', github.run_id)) || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up repository verification
        uses: ./.github/actions/setup-verification
        with:
          postgres: 'false'
          chromium: 'false'

      - name: Verify supported agent environment
        run: pnpm agent:doctor

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Check Drizzle migrations match the schema
        run: pnpm db:check-drift

      - name: Test scripts
        env:
          CI_TEST_RESULTS_FILE: ${{ runner.temp }}/ci-test-results/scripts.json
        run: pnpm test:scripts

      - name: Test documentation contracts
        run: pnpm --filter @prisma-prim/api exec vitest run src/demonstration

      # Each test family keeps its results for the acceptance-proof check in
      # `quality` (scripts/verify-acceptance-proof.mjs).
      - name: Upload script test results
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-results-scripts-${{ github.run_id }}
          overwrite: true
          path: ${{ runner.temp }}/ci-test-results/
          if-no-files-found: warn
          retention-days: 14

  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      reuse_all: ${{ steps.proof.outputs.reuse_all }}
      reuse_api: ${{ steps.proof.outputs.reuse_api }}
      proof_run: ${{ steps.proof.outputs.proof_run }}
      repeat_tests: ${{ steps.repeat.outputs.repeat_tests }}
      repeat_matrix: ${{ steps.repeat.outputs.repeat_matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          PUSH_FORCED: ${{ github.event.forced }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-change-scope.mjs

      # Pull requests only: the test files this change adds or modifies are
      # repeated by flaky_guard, so an unstable new test fails before merge.
      - name: Select changed test files to repeat
        id: repeat
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-changed-tests.mjs

      - name: Find verified reusable CI proof
        id: proof
        if: ${{ steps.classify.outputs.docs_only != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-proof-reuse.mjs

  postgres_image:
    needs: scope
    if: ${{ needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      cache_key: ${{ steps.postgres_image.outputs.key }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # A run pulls the pinned image at most once; main's cache, readable by
      # every pull request, makes later runs pull nothing.
      - name: Resolve PostgreSQL archive key
        id: postgres_image
        run: echo "key=$(bash scripts/ci-start-postgres.sh cache-key)" >> "$GITHUB_OUTPUT"

      - name: Look up cached PostgreSQL image
        id: lookup
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/postgres-image/postgres.tar
          key: ${{ steps.postgres_image.outputs.key }}
          lookup-only: true

      # Migrate main's archive from the old whole-script key (#798).
      # The exact image/platform guard prevents reuse after a pin change.
      - name: Restore compatible legacy PostgreSQL archive
        id: legacy
        if: ${{ steps.lookup.outputs.cache-hit != 'true' && steps.postgres_image.outputs.key == 'postgres-image-Linux-X64-b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/postgres-image/postgres.tar
          key: postgres-image-0ca492758d0f2da5e6d4b627ed0caef2927a438da76d7fdcd5968d9254fefb47

      - name: Acquire PostgreSQL image
        if: ${{ steps.lookup.outputs.cache-hit != 'true' && steps.legacy.outputs.cache-hit != 'true' }}
        env:
          POSTGRES_IMAGE_ARCHIVE: ${{ runner.temp }}/postgres-image/postgres.tar
        run: bash scripts/ci-start-postgres.sh acquire

      - name: Save PostgreSQL image
        if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/postgres-image/postgres.tar
          key: ${{ steps.postgres_image.outputs.key }}

  api:
    needs: [checks, scope, postgres_image]
    if: ${{ needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.reuse_api != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      matrix:
        part: ['1/3', '2/3', '3/3', serial]
    env:
      DATABASE_URL: postgresql://prisma_prim:prisma_prim@127.0.0.1:5432/prisma_prim_dev
      TEST_DATABASE_URL: postgresql://prisma_prim:prisma_prim@127.0.0.1:5432/prisma_prim_test
      POSTGRES_ADMIN_URL: postgresql://prisma_prim:prisma_prim@127.0.0.1:5432/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up repository verification
        uses: ./.github/actions/setup-verification
        with:
          chromium: 'false'

      - name: Verify supported agent environment
        run: pnpm agent:doctor:postgres

      - name: Test API
        env:
          API_TEST_PART: ${{ matrix.part }}
          CI_TEST_RESULTS_FILE: ${{ runner.temp }}/ci-test-results/api-${{ strategy.job-index }}.json
        run: |
          if [ "$API_TEST_PART" = serial ]; then
            pnpm --filter @prisma-prim/api test:postgres:serial
          else
            pnpm --filter @prisma-prim/api test:parallel --shard="$API_TEST_PART"
          fi

      - name: Upload API test results
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-results-api-${{ strategy.job-index }}-${{ github.run_id }}
          overwrite: true
          path: ${{ runner.temp }}/ci-test-results/
          if-no-files-found: warn
          retention-days: 14

  web_unit:
    needs: [checks, scope]
    if: ${{ needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.reuse_all != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up repository verification
        uses: ./.github/actions/setup-verification
        with:
          postgres: 'false'
          chromium: 'false'

      - name: Verify supported agent environment
        run: pnpm agent:doctor

      - name: Test Web unit
        env:
          CI_TEST_RESULTS_FILE: ${{ runner.temp }}/ci-test-results/web_unit.json
        run: pnpm --filter @prisma-prim/web exec vitest run

      - name: Upload Web unit test results
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-results-web_unit-${{ github.run_id }}
          overwrite: true
          path: ${{ runner.temp }}/ci-test-results/
          if-no-files-found: warn
          retention-days: 14

  browser:
    needs: [checks, scope]
    if: ${{ needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.reuse_all != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up repository verification
        uses: ./.github/actions/setup-verification
        with:
          postgres: 'false'

      - name: Verify supported agent environment
        run: pnpm agent:doctor:web

      - name: Test browser
        env:
          CI_TEST_RESULTS_FILE: ${{ runner.temp }}/ci-test-results/browser-${{ matrix.shard }}.json
        run: pnpm --filter @prisma-prim/web test:browser --shard=${{ matrix.shard }}/3

      - name: Upload browser test results
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-results-browser-${{ matrix.shard }}-${{ github.run_id }}
          overwrite: true
          path: ${{ runner.temp }}/ci-test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Namespace browser run metadata
        if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
        # Every shard writes Playwright's browser/.last-run.json; keep one visible
        # per shard so the merged evidence does not keep only the last writer.
        run: |
          if [ -f apps/web/test-results/browser/.last-run.json ]; then
            mv apps/web/test-results/browser/.last-run.json \
              "apps/web/test-results/browser/last-run-shard-${{ matrix.shard }}.json"
          fi

      - name: Upload browser evidence
        if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-part-browser-${{ matrix.shard }}-${{ github.run_id }}
          overwrite: true
          path: apps/web/test-results/
          if-no-files-found: warn
          retention-days: 14

  acceptance:
    needs: [checks, scope, postgres_image]
    if: ${{ needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.reuse_all != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      # Shard 1 owns the deliberate evidence probe; a failing shard 2 must
      # not cancel it, so acceptance shards always run to completion.
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      DATABASE_URL: postgresql://prisma_prim:prisma_prim@127.0.0.1:5432/prisma_prim_dev
      TEST_DATABASE_URL: postgresql://prisma_prim:prisma_prim@127.0.0.1:5432/prisma_prim_test
      POSTGRES_ADMIN_URL: postgresql://prisma_prim:prisma_prim@127.0.0.1:5432/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up repository verification
        uses: ./.github/actions/setup-verification

      - name: Verify supported agent environment
        run: pnpm agent:doctor:web-postgres

      - name: Test acceptance
        id: repository_tests
        env:
          CI_TEST_RESULTS_FILE: ${{ runner.temp }}/ci-test-results/acceptance-${{ matrix.shard }}.json
        run: pnpm --filter @prisma-prim/web test:browser:acceptance --shard=${{ matrix.shard }}/2

      - name: Upload acceptance test results
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-results-acceptance-${{ matrix.shard }}-${{ github.run_id }}
          overwrite: true
          path: ${{ runner.temp }}/ci-test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify acceptance failure evidence
        # One probe per run: two shards would write the same probe paths and
        # the merged evidence would keep only the last writer.
        if: ${{ matrix.shard == 1 && !cancelled() && (steps.repository_tests.outcome == 'success' || steps.repository_tests.outcome == 'failure') }}
        run: node scripts/verify-acceptance-evidence.mjs

      - name: Namespace acceptance run metadata
        if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
        # Every shard writes Playwright's acceptance/.last-run.json; keep one visible
        # per shard so the merged evidence does not keep only the last writer.
        run: |
          if [ -f apps/web/test-results/acceptance/.last-run.json ]; then
            mv apps/web/test-results/acceptance/.last-run.json \
              "apps/web/test-results/acceptance/last-run-shard-${{ matrix.shard }}.json"
          fi

      - name: Upload acceptance evidence
        if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-part-acceptance-${{ matrix.shard }}-${{ github.run_id }}
          overwrite: true
          path: apps/web/test-results/
          if-no-files-found: warn
          retention-days: 14

  build:
    needs: [checks, scope]
    if: ${{ needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.reuse_all != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up repository verification
        uses: ./.github/actions/setup-verification
        with:
          postgres: 'false'
          chromium: 'false'

      - name: Build
        run: pnpm build

  packaging:
    needs: [checks, scope, postgres_image]
    if: ${{ needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.reuse_all != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Validate Railway configuration without credentials
        run: |
          pnpm --dir .railway install --frozen-lockfile
          pnpm --dir .railway typecheck
          pnpm --dir .railway test

      - name: Restore PostgreSQL image
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/postgres-image/postgres.tar
          key: ${{ needs.postgres_image.outputs.cache_key }}

      # Reverify older main archives against the current FROM pins before reuse;
      # a verifier-only key change need not reacquire unchanged official images.
      - name: Restore pinned packaging base images
        id: packaging_images
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/packaging-images
          key: packaging-images-linux-amd64-${{ hashFiles('deploy/railway/api.Dockerfile', 'deploy/railway/web.Dockerfile', 'scripts/ci-packaging-images.mjs') }}
          restore-keys: packaging-images-linux-amd64-

      - name: Verify restored packaging base images
        id: verified_packaging_cache
        if: ${{ steps.packaging_images.outputs.cache-matched-key != '' }}
        env:
          PACKAGING_IMAGE_DIRECTORY: ${{ runner.temp }}/packaging-images
        run: |
          if node scripts/ci-packaging-images.mjs load; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
          else
            echo "verified=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Acquire pinned packaging base images
        if: ${{ steps.verified_packaging_cache.outputs.verified != 'true' }}
        env:
          PACKAGING_IMAGE_DIRECTORY: ${{ runner.temp }}/packaging-images
        run: node scripts/ci-packaging-images.mjs acquire

      - name: Save pinned packaging base images
        if: ${{ steps.packaging_images.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/packaging-images
          key: packaging-images-linux-amd64-${{ hashFiles('deploy/railway/api.Dockerfile', 'deploy/railway/web.Dockerfile', 'scripts/ci-packaging-images.mjs') }}

      - name: Prove production image packaging
        env:
          PACKAGING_IMAGE_DIRECTORY: ${{ runner.temp }}/packaging-images
          POSTGRES_IMAGE_ARCHIVE: ${{ runner.temp }}/postgres-image/postgres.tar
        run: bash scripts/railway-packaging-smoke.sh

  # Repeats the test files a pull request adds or modifies, one matrix job per
  # family slice and acceptance project, in parallel with the heavy suites.
  # The matrix is empty (and the job skipped) unless a test file changed;
  # `quality` accepts that skip only
  # when the scope proved it.
  flaky_guard:
    name: flaky_guard (${{ matrix.label }})
    needs: [checks, scope, postgres_image]
    if: ${{ needs.scope.outputs.repeat_tests == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.repeat_matrix) }}
    env:
      DATABASE_URL: postgresql://prisma_prim:prisma_prim@127.0.0.1:5432/prisma_prim_dev
      TEST_DATABASE_URL: postgresql://prisma_prim:prisma_prim@127.0.0.1:5432/prisma_prim_test
      POSTGRES_ADMIN_URL: postgresql://prisma_prim:prisma_prim@127.0.0.1:5432/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up repository verification
        uses: ./.github/actions/setup-verification
        with:
          postgres: ${{ matrix.postgres }}
          chromium: ${{ matrix.chromium }}

      - name: Verify supported agent environment
        env:
          DOCTOR_SCRIPT: ${{ matrix.doctor }}
        run: pnpm "$DOCTOR_SCRIPT"

      # File names come from the matrix through the environment only.
      - name: Repeat changed tests
        env:
          REPEAT_FAMILY: ${{ matrix.family }}
          REPEAT_FILES: ${{ toJSON(matrix.files) }}
          REPEAT_PROJECT: ${{ matrix.project }}
        run: node scripts/ci-repeat-tests.mjs

  quality:
    needs:
      [
        checks,
        scope,
        postgres_image,
        api,
        web_unit,
        browser,
        acceptance,
        build,
        packaging,
        flaky_guard,
      ]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Read-only access for the acceptance-proof check: the current pull
    # request body, its changed files and comments, and the issues it closes.
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Require every verification result
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/verify-ci-results.mjs

      - name: Download complete browser evidence
        if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
        uses: actions/download-artifact@v4
        with:
          pattern: browser-evidence-part-*-${{ github.run_id }}
          path: browser-evidence/
          merge-multiple: true

      - name: Download test results
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/download-artifact@v4
        with:
          pattern: ci-test-results-*-${{ github.run_id }}
          path: ci-test-results/
          merge-multiple: true

      # A deterministic reader of the pull request, its comments and this
      # run's results; it starts no model. It reads the current body and
      # comments, so rerunning this job picks up an edited section or a new
      # exception comment (docs/agents/acceptance-proof.md).
      - name: Verify acceptance proof
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
          PROOF_EXCEPTION_APPROVERS: ${{ vars.PROOF_EXCEPTION_APPROVERS }}
        run: node scripts/verify-acceptance-proof.mjs

      - name: Upload complete browser evidence
        if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-pr-${{ github.event.pull_request.number || github.run_id }}
          overwrite: true
          path: browser-evidence/
          if-no-files-found: warn
          retention-days: 14
