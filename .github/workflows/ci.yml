name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up repository verification
        uses: ./.github/actions/setup-verification
        with:
          postgres: 'false'
          chromium: 'false'

      - name: Verify supported agent environment
        run: pnpm agent:doctor

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test scripts
        run: pnpm test:scripts

      - name: Test documentation contracts
        run: pnpm --filter @prisma-prim/api exec vitest run src/demonstration

  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-change-scope.mjs

  api:
    needs: [checks, scope]
    if: ${{ needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        part: ['1/3', '2/3', '3/3', serial]
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: prisma_prim_dev
          POSTGRES_USER: prisma_prim
          POSTGRES_PASSWORD: prisma_prim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma_prim -d prisma_prim_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://prisma_prim:prisma_prim@127.0.0.1:5432/prisma_prim_dev
      TEST_DATABASE_URL: postgresql://prisma_prim:prisma_prim@127.0.0.1:5432/prisma_prim_test
      POSTGRES_ADMIN_URL: postgresql://prisma_prim:prisma_prim@127.0.0.1:5432/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up repository verification
        uses: ./.github/actions/setup-verification
        with:
          chromium: 'false'

      - name: Verify supported agent environment
        run: pnpm agent:doctor:postgres

      - name: Test API
        env:
          API_TEST_PART: ${{ matrix.part }}
        run: |
          if [ "$API_TEST_PART" = serial ]; then
            pnpm --filter @prisma-prim/api test:postgres:serial
          else
            pnpm --filter @prisma-prim/api test:parallel --shard="$API_TEST_PART"
          fi

  web_unit:
    needs: [checks, scope]
    if: ${{ needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up repository verification
        uses: ./.github/actions/setup-verification
        with:
          postgres: 'false'
          chromium: 'false'

      - name: Verify supported agent environment
        run: pnpm agent:doctor

      - name: Test Web unit
        run: pnpm --filter @prisma-prim/web exec vitest run

  browser:
    needs: [checks, scope]
    if: ${{ needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up repository verification
        uses: ./.github/actions/setup-verification
        with:
          postgres: 'false'

      - name: Verify supported agent environment
        run: pnpm agent:doctor:web

      - name: Test browser
        run: pnpm --filter @prisma-prim/web test:browser --shard=${{ matrix.shard }}/3

      - name: Namespace browser run metadata
        if: ${{ always() && github.event_name == 'pull_request' }}
        # Every shard writes Playwright's browser/.last-run.json; keep one
        # per shard so the merged evidence does not keep only the last writer.
        run: |
          if [ -f apps/web/test-results/browser/.last-run.json ]; then
            mv apps/web/test-results/browser/.last-run.json \
              "apps/web/test-results/browser/.last-run-shard-${{ matrix.shard }}.json"
          fi

      - name: Upload browser evidence
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-part-browser-${{ matrix.shard }}-${{ github.run_id }}
          overwrite: true
          path: apps/web/test-results/
          if-no-files-found: warn
          retention-days: 14

  acceptance:
    needs: [checks, scope]
    if: ${{ needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: prisma_prim_dev
          POSTGRES_USER: prisma_prim
          POSTGRES_PASSWORD: prisma_prim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma_prim -d prisma_prim_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://prisma_prim:prisma_prim@127.0.0.1:5432/prisma_prim_dev
      TEST_DATABASE_URL: postgresql://prisma_prim:prisma_prim@127.0.0.1:5432/prisma_prim_test
      POSTGRES_ADMIN_URL: postgresql://prisma_prim:prisma_prim@127.0.0.1:5432/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up repository verification
        uses: ./.github/actions/setup-verification

      - name: Verify supported agent environment
        run: pnpm agent:doctor:web-postgres

      - name: Test acceptance
        id: repository_tests
        run: pnpm --filter @prisma-prim/web test:browser:acceptance --shard=${{ matrix.shard }}/2

      - name: Verify acceptance failure evidence
        # One probe per run: two shards would write the same probe paths and
        # the merged evidence would keep only the last writer.
        if: ${{ matrix.shard == 1 && !cancelled() && (steps.repository_tests.outcome == 'success' || steps.repository_tests.outcome == 'failure') }}
        run: node scripts/verify-acceptance-evidence.mjs

      - name: Namespace acceptance run metadata
        if: ${{ always() && github.event_name == 'pull_request' }}
        # Every shard writes Playwright's acceptance/.last-run.json; keep one
        # per shard so the merged evidence does not keep only the last writer.
        run: |
          if [ -f apps/web/test-results/acceptance/.last-run.json ]; then
            mv apps/web/test-results/acceptance/.last-run.json \
              "apps/web/test-results/acceptance/.last-run-shard-${{ matrix.shard }}.json"
          fi

      - name: Upload acceptance evidence
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-part-acceptance-${{ matrix.shard }}-${{ github.run_id }}
          overwrite: true
          path: apps/web/test-results/
          if-no-files-found: warn
          retention-days: 14

  build:
    needs: [checks, scope]
    if: ${{ needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up repository verification
        uses: ./.github/actions/setup-verification
        with:
          postgres: 'false'
          chromium: 'false'

      - name: Build
        run: pnpm build

  packaging:
    needs: [checks, scope]
    if: ${{ needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Validate Railway configuration without credentials
        run: |
          pnpm --dir .railway install --frozen-lockfile
          pnpm --dir .railway typecheck
          pnpm --dir .railway test

      - name: Prove production image packaging
        run: bash scripts/railway-packaging-smoke.sh

  quality:
    needs: [checks, scope, api, web_unit, browser, acceptance, build, packaging]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Require every verification result
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/verify-ci-results.mjs

      - name: Download complete browser evidence
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/download-artifact@v4
        with:
          pattern: browser-evidence-part-*-${{ github.run_id }}
          path: browser-evidence/
          merge-multiple: true

      - name: Upload complete browser evidence
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-pr-${{ github.event.pull_request.number }}
          overwrite: true
          path: browser-evidence/
          if-no-files-found: warn
          retention-days: 14
