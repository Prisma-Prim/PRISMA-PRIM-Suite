name: Temporary PG17 repeated lifecycle evidence

on:
  pull_request:
    paths:
      - apps/api/src/database/previous-schema.migration.test.ts
      - apps/api/src/database/previous-schema-test-lifecycle.ts
      - apps/api/src/database/previous-schema-test-lifecycle.test.ts
      - .github/workflows/pg17-repeated-evidence.yml

permissions:
  contents: read

jobs:
  repeated-lifecycle-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: prisma_prim_dev
          POSTGRES_USER: prisma_prim
          POSTGRES_PASSWORD: prisma_prim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma_prim -d prisma_prim_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://prisma_prim:prisma_prim@127.0.0.1:5432/prisma_prim_dev
      TEST_DATABASE_URL: postgresql://prisma_prim:prisma_prim@127.0.0.1:5432/prisma_prim_test
      POSTGRES_ADMIN_URL: postgresql://prisma_prim:prisma_prim@127.0.0.1:5432/postgres

    steps:
      - name: Check out exact requested head
        uses: actions/checkout@v4

      - name: Set up repository verification
        uses: ./.github/actions/setup-verification

      - name: Verify preflight prerequisites
        run: pnpm preflight:local --check-only

      - name: Run ten consecutive migration preflights
        run: |
          set -euo pipefail
          verify_cleanup() {
            pnpm --filter @prisma-prim/api exec node --input-type=module <<'NODE'
          import pg from 'pg';

          const pool = new pg.Pool({ connectionString: process.env.POSTGRES_ADMIN_URL });
          try {
            const databases = await pool.query(
              "select datname from pg_database where datname like 'prisma_prim_previous_%_test'",
            );
            const connections = await pool.query(
              "select datname, pid from pg_stat_activity where datname like 'prisma_prim_previous_%_test'",
            );
            if (databases.rowCount !== 0 || connections.rowCount !== 0) {
              throw new Error(
                `Residual previous-schema resources: databases=${JSON.stringify(databases.rows)} connections=${JSON.stringify(connections.rows)}`,
              );
            }
          } finally {
            await pool.end();
          }
          NODE
          }
          for run in $(seq 1 10); do
            echo "Migration preflight ${run}/10"
            pnpm --filter @prisma-prim/api test:preflight:migration
            verify_cleanup
          done

      - name: Run three consecutive PostgreSQL serial suites
        run: |
          set -euo pipefail
          verify_cleanup() {
            pnpm --filter @prisma-prim/api exec node --input-type=module <<'NODE'
          import pg from 'pg';

          const pool = new pg.Pool({ connectionString: process.env.POSTGRES_ADMIN_URL });
          try {
            const databases = await pool.query(
              "select datname from pg_database where datname like 'prisma_prim_previous_%_test'",
            );
            const connections = await pool.query(
              "select datname, pid from pg_stat_activity where datname like 'prisma_prim_previous_%_test'",
            );
            if (databases.rowCount !== 0 || connections.rowCount !== 0) {
              throw new Error(
                `Residual previous-schema resources: databases=${JSON.stringify(databases.rows)} connections=${JSON.stringify(connections.rows)}`,
              );
            }
          } finally {
            await pool.end();
          }
          NODE
          }
          for run in $(seq 1 3); do
            echo "PostgreSQL serial suite ${run}/3"
            pnpm --filter @prisma-prim/api test:postgres:serial
            verify_cleanup
          done
