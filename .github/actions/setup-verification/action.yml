name: Set up repository verification
description: Install the pinned toolchain and dependencies, with optional isolated PostgreSQL and Chromium.

inputs:
  postgres:
    description: Provision the isolated test database using POSTGRES_ADMIN_URL.
    default: 'true'
  chromium:
    description: Restore or install Chromium using the Ubuntu 24.04 runner's system libraries.
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # Database shards share the one image archive the postgres_image job
    # cached, instead of each pulling from the throttled public registry.
    - name: Restore PostgreSQL image
      if: ${{ inputs.postgres == 'true' }}
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/postgres-image/postgres.tar
        key: postgres-image-${{ hashFiles('scripts/ci-start-postgres.sh') }}

    - name: Start PostgreSQL
      if: ${{ inputs.postgres == 'true' }}
      shell: bash
      env:
        POSTGRES_IMAGE_ARCHIVE: ${{ runner.temp }}/postgres-image/postgres.tar
      run: bash scripts/ci-start-postgres.sh start

    - name: Provision isolated test database
      if: ${{ inputs.postgres == 'true' }}
      shell: bash
      run: >-
        pnpm --filter @prisma-prim/api exec node --input-type=module --eval
        'import pg from "pg"; const client = new pg.Client({ connectionString:
        process.env.POSTGRES_ADMIN_URL }); await client.connect(); const existing =
        await client.query("SELECT 1 FROM pg_database WHERE datname = $1",
        ["prisma_prim_test"]); if (existing.rowCount === 0) await
        client.query("CREATE DATABASE prisma_prim_test OWNER prisma_prim"); await
        client.end();'

    # Ubuntu 24.04 already supplies the supported Chromium system libraries.
    # Bind browser downloads to the installed Playwright version and platform.
    - name: Resolve Playwright version
      if: ${{ inputs.chromium == 'true' }}
      id: playwright
      shell: bash
      run: |
        version=$(pnpm --filter @prisma-prim/web exec playwright --version)
        echo "version=${version#Version }" >> "$GITHUB_OUTPUT"

    - name: Cache Chromium
      if: ${{ inputs.chromium == 'true' }}
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: chromium-ubuntu-24.04-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

    - name: Ensure Chromium is installed
      if: ${{ inputs.chromium == 'true' }}
      shell: bash
      run: pnpm --filter @prisma-prim/web exec playwright install chromium
