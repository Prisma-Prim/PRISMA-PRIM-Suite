name: Set up repository verification
description: Install the pinned toolchain and dependencies, with optional isolated PostgreSQL and Chromium.

inputs:
  postgres:
    description: Provision the isolated test database using POSTGRES_ADMIN_URL.
    default: 'true'
  chromium:
    description: Install Chromium and its system dependencies for browser verification.
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Provision isolated test database
      if: ${{ inputs.postgres == 'true' }}
      shell: bash
      run: >-
        pnpm --filter @prisma-prim/api exec node --input-type=module --eval
        'import pg from "pg"; const client = new pg.Client({ connectionString:
        process.env.POSTGRES_ADMIN_URL }); await client.connect(); const existing =
        await client.query("SELECT 1 FROM pg_database WHERE datname = $1",
        ["prisma_prim_test"]); if (existing.rowCount === 0) await
        client.query("CREATE DATABASE prisma_prim_test OWNER prisma_prim"); await
        client.end();'

    - name: Install Chromium explicitly
      if: ${{ inputs.chromium == 'true' }}
      shell: bash
      run: pnpm --filter @prisma-prim/web exec playwright install --with-deps chromium
