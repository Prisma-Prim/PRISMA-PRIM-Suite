- form "Записать решение о сертификации":
  - paragraph: Утверждающий, не входящий в аудиторскую группу, записывает решение органа по сертификации. До записи сертификата исправление с указанием причины может изменить его тексты и ссылки, но не результат. Ничего не выбрано заранее. При выдаче указывается выданный текст сертификата для каждого языка сертификата.
  - group "Решение":
    - text: Решение
    - radio "Сертификация выдана" [checked]
    - text: Сертификация выдана
    - radio "В сертификации отказано"
    - text: В сертификации отказано
  - group "Выданные тексты сертификата":
    - text: Выданные тексты сертификата
    - group "Текст сертификата 1":
      - text: Текст сертификата 1 Язык
      - textbox "Язык": ro
      - text: Код языка этого текста сертификата, например ro или en; каждый язык один раз. Наименование держателя
      - textbox "Наименование держателя": Lactis Demo SRL
      - text: Адрес
      - textbox "Адрес": Str. Exemplu 1, Demo City
      - text: Область
      - textbox "Область": Producerea laptelui pasteurizat (exemplu)
    - button "Добавить язык сертификата"
  - text: Дата решения
  - textbox "Дата решения": 2026-11-17
  - text: Лицо, принявшее решение
  - textbox "Лицо, принявшее решение": Decision Maker Demo
  - text: Должность лица, принявшего решение
  - textbox "Должность лица, принявшего решение": Head of the fictional certification body
  - text: Обоснование
  - textbox "Обоснование": "Decizie fictivă: recomandare susținută de dosar și verificarea acțiunilor."
  - text: Использованная дополнительная информация
  - textbox "Использованная дополнительная информация"
  - checkbox "Подтверждаю, что лицо, принявшее решение, не входит в аудиторскую группу." [checked]
  - text: Подтверждаю, что лицо, принявшее решение, не входит в аудиторскую группу.
  - button "Записать решение"