- form "Исправить отчёт этапа 1":
  - paragraph: Исправление записывает новую версию с её причиной. Прежние версии остаются в хронологии.
  - paragraph: "Запишите вывод по этапу 1: завершённый анализ документации, готов ли клиент к этапу 2 и на каком основании, с приложенными отчётом и списком участников."
