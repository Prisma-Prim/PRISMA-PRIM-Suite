  - group "Готовность к этапу 2":
    - text: Готовность к этапу 2
    - radio "Готов к этапу 2" [checked]
    - text: Готов к этапу 2
    - radio "Не готов к этапу 2"
    - text: Не готов к этапу 2
  - text: Обоснование вывода
  - textbox "Обоснование вывода": "Exemplu fictiv: documentația a fost completată; pregătit pentru etapa 2."
  - text: PDF отчёта об аудите
