- form "Предложить новую версию группы":
  - paragraph: Новая версия заменяет текущее предложение, указывает причину и требует нового решения утверждающего. Прежние версии остаются в хронологии.
  - paragraph: Предложите участников, которые будут проводить аудит по этому делу. В группе ровно один руководитель группы, а категорией пищевой цепи клиента владеет руководитель группы или, если нет, технический эксперт. Каждый участник явно отвечает на четыре заявления о беспристрастности; ответ «нет» требует описания конфликта.
  - group "Участник 1":
    - text: Участник 1 Имя
    - textbox "Имя": Ada Ionescu
