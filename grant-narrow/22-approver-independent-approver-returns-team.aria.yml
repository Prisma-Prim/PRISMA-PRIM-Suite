- form "Записать решение":
  - paragraph: "Примите решение по версии 1 группы: утвердите её или верните руководителю программы с указанием причины."
  - group "Решение":
    - text: Решение
    - radio "Утвердить группу"
    - text: Утвердить группу
    - radio "Вернуть группу" [checked]
    - text: Вернуть группу
  - text: Причина возврата
  - textbox "Причина возврата": "Exemplu fictiv: precizați competența șefului echipei."
  - group "Решение по группе органом по сертификации":
    - text: Решение по группе органом по сертификации
    - checkbox "Это действие совершил сотрудник органа по сертификации; я записываю его от его имени."
    - text: Это действие совершил сотрудник органа по сертификации; я записываю его от его имени. Вы остаётесь записанным как участник, внёсший запись. Укажите, кто действовал, его должность и дату действия; подписанная форма, приложенная к делу, необязательна.
  - checkbox "Я подтверждаю, что лицо, принимающее решение по этой группе, не входит в аудиторскую группу." [checked]
  - text: Я подтверждаю, что лицо, принимающее решение по этой группе, не входит в аудиторскую группу.
  - button "Записать решение"