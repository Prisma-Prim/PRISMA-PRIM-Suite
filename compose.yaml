services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: prisma_prim
      POSTGRES_USER: prisma_prim
      POSTGRES_PASSWORD: prisma_prim
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prisma_prim -d prisma_prim']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro

volumes:
  postgres_data:
